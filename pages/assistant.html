<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" class="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>陪练 · LifeFlow</title>
<meta name="theme-color" content="#F7F4EF">
<style id="theme-vars">/* ============================================================
   LifeFlow · 目标系统 UI 基座（v3 · 平静 / 高级 / 被温柔对待）
   ------------------------------------------------------------
   设计哲学：降噪、升温、变柔软。保留品牌蓝身份，但让整体像一间
   被温柔照料的私人空间，而非功能密集的控制台。
   铁律：全 App 禁用纯黑 #000 与纯白 #FFF；阴影用彩色叠加，禁灰阴影。
   ============================================================ */

/* ============ 1. RESET ============ */
*, *::before, *::after { box-sizing: border-box; }
* { margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { min-height: 100vh;  background: var(--bg); }

button { font-family: inherit; font-size: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
ul, ol { list-style: none; }
img, svg { display: block; max-width: 100%; }

/* ============ 2. LIGHT TOKENS（日间 · 暖中性 + 品牌蓝） ============ */
:root {
  color-scheme: light;

  /* —— 表面 —— */
  --bg: #FAF6F0;            /* 页面底 · 暖白（Headspace 暖底） */
  --bg-glow-1: rgba(0, 47, 167, 0.07);     /* 顶部克莱因蓝光晕 */
  --bg-glow-2: rgba(139, 126, 200, 0.06);  /* 顶部柔和紫光晕 */
  --bg-glow-warm: rgba(255, 138, 92, 0.05); /* 暖橙光晕（珊瑚橙补暖） */
  --card: #FFFFFF;          /* 卡片底 · 白 */
  --surface-2: #F3EFE8;     /* 次级表面 · 暖灰米 */
  --surface-3: #EAE5DB;     /* 三级表面 */
  --scrim: rgba(38, 34, 30, 0.32);

  /* —— 文字 —— */
  --text-1: #26221E;        /* 主文字 · 暖墨（非纯黑） */
  --text-2: #7A746C;        /* 次文字 · 暖灰 */
  --text-3: #A69F94;        /* 弱文字 */
  --text-inverse: #FDFBF7;

  /* —— 边框 —— */
  --border: #EAE6DF;
  --border-strong: #DCD6CB;

  /* —— 品牌 —— */
  --brand: #002FA7;         /* 克莱因蓝 · 学习/专注/目标主色 */
  --brand-strong: #001F6E;
  --brand-soft: rgba(0, 47, 167, 0.10);
  --brand-softer: rgba(0, 47, 167, 0.06);
  --purple: #8B7EC8;        /* 柔和紫 · 养生/冥想/用药 */
  --purple-soft: rgba(139, 126, 200, 0.12);
  --gradient: linear-gradient(135deg, #002FA7 0%, #8B7EC8 100%);

  /* —— 语义色 —— */
  --goal-blue: #4169E1;     /* 宝蓝 · 进度/饮水 */
  --goal-blue-soft: rgba(65, 105, 225, 0.12);
  --life-green: #7BAE7F;    /* 鼠尾草绿 · 生活/习惯/饮食/收入 */
  --life-green-soft: rgba(123, 174, 127, 0.14);
  --expense-red: #FF8A5C;   /* 珊瑚橙 · 训练/支出 */
  --expense-red-soft: rgba(255, 138, 92, 0.12);
  --pause-amber: #D99A2B;
  --pause-amber-soft: rgba(217, 154, 43, 0.14);
  --emotion: #E8849A;         /* 暖粉玫红 · 情绪 */
  --emotion-soft: rgba(232, 132, 154, 0.14);

  /* —— 睡眠（深夜蓝系，入睡仪式 / 三段分色） —— */
  --sleep-night: #1B2A4A;    /* 深夜蓝 · 入睡仪式深色背景 */
  --sleep-seg-deep: #6E5BB8; /* 深睡 */
  --sleep-seg-mid: #8B7EC8;  /* 浅睡 */
  --sleep-seg-light: #BAB0E2;/* REM */

  /* —— 阴影（中性暖灰，去蓝调） —— */
  --shadow-xs: 0 1px 2px rgba(38, 34, 30, 0.05);
  --shadow-sm: 0 2px 10px rgba(38, 34, 30, 0.05);
  --shadow-md: 0 8px 24px rgba(38, 34, 30, 0.08);
  --shadow-lg: 0 18px 44px rgba(38, 34, 30, 0.12);
  --shadow-card: 0 1px 2px rgba(38, 34, 30, 0.04), 0 10px 30px rgba(38, 34, 30, 0.06);
  --shadow-primary: 0 8px 22px rgba(0, 47, 167, 0.20);

  /* —— 圆角 —— */
  --r-sm: 12px;
  --r-md: 16px;
  --r-lg: 20px;
  --r-xl: 24px;
  --r-pill: 999px;

  /* —— 字体 —— */
  --font-sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", "Helvetica Neue", sans-serif;
  --font-num: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "PingFang SC", monospace;

  /* —— 字号 / 行高 —— */
  --fs-display: 34px;
  --fs-h1: 28px;
  --fs-h2: 20px;
  --fs-h3: 17px;
  --fs-body: 15px;
  --fs-sm: 13px;
  --fs-caption: 12px;

  /* —— 间距 —— */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 20px;
  --sp-6: 24px;
  --sp-8: 32px;

  /* ============ 18. 尺寸 token（全局内容区规范） ============ */
  --icon-sm: 32px;   /* 紧凑小图标 */
  --icon-md: 38px;   /* 标准条目图标容器 */
  --icon-lg: 44px;   /* 概览/量化头大图标 */
  --pad-card: 18px 20px;      /* 标准卡片内边距 */
  --pad-card-sm: 14px 20px;   /* 紧凑卡（设置区/说明卡） */
  --gap-list: 10px;           /* 条目纵向间距 */
  --h-title: 18px;  --h-name: 16px;  --fs-meta: 12px;
  --r-icon: var(--r-lg);      /* 图标容器圆角 20px */

  /* —— 动效 —— */
  --ease: cubic-bezier(0.4, 0, 0.2, 1);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --dur-fast: 200ms;
  --dur: 300ms;
  --dur-slow: 400ms;
}

/* ============ 3. DARK TOKENS（夜间 · SleepCore 高级感） ============ */
[data-theme="dark"] {
  color-scheme: dark;

  /* —— 表面（深海军蓝 → 靛蓝 → 深紫渐变，非纯黑） —— */
  --bg: #0D1117;
  --bg-glow-1: rgba(74, 108, 240, 0.16);
  --bg-glow-2: rgba(91, 84, 200, 0.14);
  --card: rgba(255, 255, 255, 0.05);       /* 玻璃拟态 */
  --surface-2: rgba(255, 255, 255, 0.06);
  --surface-3: rgba(255, 255, 255, 0.10);
  --scrim: rgba(4, 6, 12, 0.60);

  /* —— 文字 —— */
  --text-1: #EDEAE4;        /* 暖白 */
  --text-2: #8A8AA0;
  --text-3: #5E5F73;
  --text-inverse: #0D1117;

  /* —— 边框 —— */
  --border: rgba(255, 255, 255, 0.08);
  --border-strong: rgba(255, 255, 255, 0.14);

  /* —— 品牌（暗色下提亮以保证对比，光晕用低透明度） —— */
  --brand: #4A6CF0;
  --brand-strong: #7A9CF8;
  --brand-soft: rgba(74, 108, 240, 0.16);
  --brand-softer: rgba(74, 108, 240, 0.10);
  --purple: #A79BD8;
  --purple-soft: rgba(167, 155, 216, 0.16);
  --gradient: linear-gradient(135deg, #3B5BDB 0%, #8A7ED0 100%);

  /* —— 语义色 —— */
  --goal-blue: #6E8FE8;
  --goal-blue-soft: rgba(110, 143, 232, 0.16);
  --life-green: #8CBE8E;
  --life-green-soft: rgba(140, 190, 142, 0.16);
  --expense-red: #FF9A75;
  --expense-red-soft: rgba(255, 154, 117, 0.16);
  --pause-amber: #E0AF52;
  --pause-amber-soft: rgba(224, 175, 82, 0.16);
  --emotion: #EFA6BC;
  --emotion-soft: rgba(239, 166, 188, 0.16);

  /* —— 阴影（暗色光晕） —— */
  --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.30);
  --shadow-sm: 0 2px 12px rgba(0, 0, 0, 0.40);
  --shadow-md: 0 8px 28px rgba(0, 0, 0, 0.50);
  --shadow-lg: 0 18px 48px rgba(0, 0, 0, 0.60);
  --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.28), 0 10px 32px rgba(0, 0, 0, 0.42);
  --shadow-primary: 0 8px 26px rgba(62, 107, 224, 0.36);
}

/* ============ 4. 全局基础 ============ */
body {
  font-family: var(--font-sans);
  font-size: var(--fs-body);
  line-height: 1.6;
  color: var(--text-1);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
}

/* 环境光晕背景（柔和 · 非纯色） */
.app-stage {
  position: relative;
  min-height: 100vh;
  background:
    radial-gradient(1100px 560px at 50% -12%, var(--bg-glow-1), transparent 62%),
    radial-gradient(760px 420px at 88% -4%, var(--bg-glow-2), transparent 58%),
    radial-gradient(900px 520px at -12% 100%, var(--bg-glow-warm), transparent 62%),
    var(--bg);
}

[data-theme="dark"] .app-stage {
  background:
    radial-gradient(1000px 560px at 18% -8%, var(--bg-glow-1), transparent 58%),
    radial-gradient(900px 520px at 88% 8%, var(--bg-glow-2), transparent 58%),
    linear-gradient(180deg, #0D1117 0%, #141A2E 58%, #1A1530 100%);
}

/* 430px 容器 · 移动端优先 */
.app {
  position: relative;
  max-width: 430px;
  margin: 0 auto;
  min-height: 100vh;
  padding-bottom: calc(148px + env(safe-area-inset-bottom, 0px));
}

/* 桌面呈现：居中 + 侧边框 + 柔和投影，像一台安静的设备 */
@media (min-width: 768px) {
  body { background: #0C0F16; }
  .app-stage {
    background: #0C0F16;
    padding: 32px 0;
  }
  .app {
    min-height: calc(100vh - 64px);
    border-radius: 40px;
    overflow: hidden;
    box-shadow: 0 40px 120px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.06);
    background:
      radial-gradient(1000px 520px at 50% -10%, var(--bg-glow-1), transparent 60%),
      radial-gradient(800px 420px at 88% -4%, var(--bg-glow-2), transparent 56%),
      radial-gradient(900px 520px at -12% 100%, var(--bg-glow-warm), transparent 62%),
      var(--bg);
  }
  [data-theme="dark"] .app {
    background:
      radial-gradient(1000px 560px at 18% -8%, var(--bg-glow-1), transparent 58%),
      radial-gradient(900px 520px at 88% 8%, var(--bg-glow-2), transparent 58%),
      linear-gradient(180deg, #0D1117 0%, #141A2E 58%, #1A1530 100%);
  }
}

/* ============ 5. 排版工具 ============ */
.t-display {
  font-size: var(--fs-display);
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.18;
}
.t-h1 { font-size: var(--fs-h1); font-weight: 700; letter-spacing: -0.02em; line-height: 1.24; }
.t-h2 { font-size: var(--fs-h2); font-weight: 650; letter-spacing: -0.01em; line-height: 1.3; }
.t-h3 { font-size: var(--fs-h3); font-weight: 600; line-height: 1.4; }
.t-body { font-size: var(--fs-body); font-weight: 400; line-height: 1.6; }
.t-sm { font-size: var(--fs-sm); font-weight: 400; line-height: 1.55; }
.t-caption { font-size: var(--fs-caption); font-weight: 400; line-height: 1.5; }
.t-num { font-variant-numeric: tabular-nums; font-family: var(--font-num); }
.t-muted { color: var(--text-2); }
.t-faint { color: var(--text-3); }
.t-brand { color: var(--brand); }

/* ============ 6. 布局工具 ============ */
.page { padding: 0 var(--sp-4); }
.stack { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; }
.grow { flex: 1; min-width: 0; }
.gap-2 { gap: var(--sp-2); }
.gap-3 { gap: var(--sp-3); }
.gap-4 { gap: var(--sp-4); }
.space-y-4 > * + * { margin-top: var(--sp-4); }
.space-y-3 > * + * { margin-top: var(--sp-3); }

/* 区块标题（跨页通用 · 标题左 / 计数右） */
.section-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
.section-head__title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; color: var(--text-1); }
.section-head__hint { font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.section-head__meta { font-size: 13px; color: var(--text-3); font-variant-numeric: tabular-nums; }

/* ============ 7. 顶栏 ============ */
.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  padding: 14px 16px;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  -webkit-backdrop-filter: blur(18px) saturate(160%);
  backdrop-filter: blur(18px) saturate(160%);
}
.topbar__title { flex: 1; text-align: center; font-size: var(--fs-h3); font-weight: 650; }
.topbar__side { width: 36px; display: flex; justify-content: flex-start; }
.topbar__side--right { justify-content: flex-end; }

.icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  border-radius: var(--r-pill);
  color: var(--text-1);
  transition: background var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
}
.icon-btn:active { transform: scale(0.92); background: var(--surface-2); }
.icon-btn svg { width: 20px; height: 20px; }

/* ============ 8. 按钮 ============ */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  height: 52px;
  padding: 0 22px;
  border-radius: var(--r-pill);
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 0.01em;
  transition: transform var(--dur-fast) var(--ease), box-shadow var(--dur) var(--ease), opacity var(--dur-fast) var(--ease);
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.btn:active { transform: scale(0.97); }
.btn svg { width: 20px; height: 20px; }

.btn--primary {
  background: var(--gradient);
  color: #FFFFFF;
  box-shadow: var(--shadow-primary);
}
.btn--primary:hover { box-shadow: 0 10px 28px rgba(0, 47, 167, 0.25); }

.btn--soft {
  background: var(--brand-soft);
  color: var(--brand);
  height: 44px;
  padding: 0 18px;
  font-size: 15px;
}
[data-theme="dark"] .btn--soft { color: var(--brand-strong); }

.btn--ghost {
  background: var(--surface-2);
  color: var(--text-1);
  height: 44px;
  padding: 0 18px;
  font-size: 15px;
}

.btn--sm { height: 38px; padding: 0 16px; font-size: 13px; border-radius: var(--r-pill); }
.btn--sm svg { width: 16px; height: 16px; }
.btn--block { width: 100%; }
.btn:disabled { opacity: 0.45; pointer-events: none; }

/* ============ 9. 输入框 ============ */
.field { display: flex; flex-direction: column; gap: 8px; }
.field__label { font-size: var(--fs-sm); font-weight: 600; color: var(--text-2); }

.input {
  width: 100%;
  height: 50px;
  padding: 0 16px;
  border-radius: var(--r-md);
  border: 1px solid var(--border);
  background: var(--surface-2);
  font-size: 15px;
  color: var(--text-1);
  outline: none;
  transition: border-color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
}
.input::placeholder { color: var(--text-3); }
.input:focus {
  border-color: var(--brand);
  background: var(--card);
  box-shadow: 0 0 0 4px var(--brand-softer);
}

.textarea {
  width: 100%;
  min-height: 88px;
  padding: 14px 16px;
  border-radius: var(--r-md);
  border: 1px solid var(--border);
  background: var(--surface-2);
  font-size: 15px;
  line-height: 1.6;
  color: var(--text-1);
  outline: none;
  resize: vertical;
  transition: border-color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
}
.textarea::placeholder { color: var(--text-3); }
.textarea:focus { border-color: var(--brand); background: var(--card); box-shadow: 0 0 0 4px var(--brand-softer); }

/* ============ 10. 卡片 ============ */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  padding: var(--pad-card);
  box-shadow: var(--shadow-card);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
}
.card--inset { background: var(--surface-2); border: 1px solid var(--border); box-shadow: none; }

/* ============ 11. 进度条 ============ */
.progress {
  position: relative;
  height: 8px;
  border-radius: var(--r-pill);
  background: var(--surface-2);
  overflow: hidden;
}
.progress--thin { height: 6px; }
.progress--lg { height: 12px; }
.progress__fill {
  position: absolute;
  inset: 0 auto 0 0;
  width: 0;
  border-radius: var(--r-pill);
  background: var(--gradient);
  transition: width 0.6s var(--ease-out);
}
.progress__fill--green { background: linear-gradient(135deg, #7BAE7F, #5E9A62); }
.progress__fill--blue { background: linear-gradient(135deg, #4169E1, #002FA7); }
.progress__fill--amber { background: linear-gradient(135deg, #E0AF52, #D99A2B); }
[data-theme="dark"] .progress { background: rgba(255, 255, 255, 0.08); }

/* ============ 12. 标签 / 状态 ============ */
.tag {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 26px;
  padding: 0 10px;
  border-radius: var(--r-pill);
  font-size: var(--fs-caption);
  font-weight: 600;
  line-height: 1;
}
.tag__dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.tag--active { background: var(--life-green-soft); color: #1F9D5C; }
[data-theme="dark"] .tag--active { color: var(--life-green); }
.tag--paused { background: var(--pause-amber-soft); color: var(--pause-amber); }
.tag--done { background: var(--brand-soft); color: var(--brand); }
[data-theme="dark"] .tag--done { color: var(--brand-strong); }

/* 过滤胶囊 */
.chips {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 2px 0;
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto;
  height: 38px;
  padding: 0 18px;
  border-radius: var(--r-pill);
  font-size: 14px;
  font-weight: 550;
  color: var(--text-2);
  background: var(--surface-2);
  border: 1px solid transparent;
  transition: all var(--dur-fast) var(--ease);
}
.chip.is-active {
  color: #FFFFFF;
  background: var(--gradient);
  box-shadow: var(--shadow-primary);
}

/* ============ 13. 底部导航 ============ */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 430px;
  z-index: 40;
  display: flex;
  padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px));
  background: color-mix(in srgb, var(--bg) 78%, transparent);
  border-top: 1px solid var(--border);
  -webkit-backdrop-filter: blur(22px) saturate(180%);
  backdrop-filter: blur(22px) saturate(180%);
}
@media (min-width: 768px) {
  .bottom-nav { bottom: 32px; border-radius: 0 0 40px 40px; }
}
.nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 6px 0;
  border-radius: var(--r-md);
  color: var(--text-3);
  transition: color var(--dur) var(--ease);
  -webkit-tap-highlight-color: transparent;
}
.nav-item svg { width: 22px; height: 22px; }
.nav-item__label { font-size: 11px; font-weight: 550; line-height: 1; }
.nav-item.is-active { color: var(--brand); }
.nav-item.is-active .nav-item__icon {
  position: relative;
}
.nav-item.is-active .nav-item__icon::after {
  content: '';
  position: absolute;
  left: 50%;
  bottom: -7px;
  transform: translateX(-50%);
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--gradient);
}

/* ============ 13.5 全局悬浮球（AI 助手入口） ============ */
.fab-wrap {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 430px;
  bottom: calc(84px + env(safe-area-inset-bottom, 0px));
  display: flex;
  justify-content: flex-end;
  padding: 0 16px;
  pointer-events: none;
  z-index: 45;
}
@media (min-width: 768px) {
  .fab-wrap { bottom: 116px; }
}
.fab {
  pointer-events: auto;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--gradient);
  color: #FFFFFF;
  box-shadow: 0 8px 24px rgba(0, 47, 167, 0.28);
  animation: breath 3.2s var(--ease) infinite;
  transition: transform var(--dur-fast) var(--ease);
  -webkit-tap-highlight-color: transparent;
}
.fab:active { transform: scale(0.88); }
.fab svg { width: 24px; height: 24px; }

/* ============ 14. 弹层 ============ */
.sheet {
  position: fixed;
  inset: 0;
  z-index: 60;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  pointer-events: none;
}
.sheet.is-open { pointer-events: auto; }
.sheet__scrim {
  position: absolute;
  inset: 0;
  background: var(--scrim);
  opacity: 0;
  transition: opacity var(--dur) var(--ease);
  -webkit-backdrop-filter: blur(8px) saturate(1.15);
  backdrop-filter: blur(8px) saturate(1.15);
}
.sheet__panel {
  position: relative;
  width: 100%;
  max-width: 430px;
  max-height: 88vh;
  overflow-y: auto;
  background: var(--card);
  border-radius: 24px 24px 0 0;
  border-top: 1px solid var(--border);
  padding: 16px 20px calc(20px + env(safe-area-inset-bottom, 0px));
  box-shadow: 0 -8px 32px rgba(15, 23, 42, 0.10), var(--shadow-lg);
  transform: translateY(100%);
  transition: transform var(--dur-slow) cubic-bezier(0.32, 0.72, 0, 1);
}
.sheet.is-open .sheet__panel { transform: translateY(0) scale(1); }
[data-theme="dark"] .sheet__panel {
  box-shadow: 0 -8px 32px rgba(15, 23, 42, 0.18), var(--shadow-lg);
}
.sheet__grip {
  width: 48px;
  height: 5px;
  border-radius: var(--r-pill);
  background: var(--text-3);
  opacity: 0.55;
  margin: 0 auto 14px;
}
.sheet__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.sheet__title {
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -0.01em;
  color: var(--text-1);
}
.sheet__close {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-3);
  background: var(--surface-2);
  -webkit-tap-highlight-color: transparent;
}
.sheet__close svg { width: 17px; height: 17px; }
.sheet__actions {
  display: flex;
  gap: 10px;
  margin-top: 20px;
}
.sheet__actions .btn { flex: 1; }
.sheet.is-open .sheet__scrim { opacity: 1; }
.sheet.is-open .sheet__panel { transform: translateY(0) scale(1); }

/* ============ 15. 空状态 ============ */
.empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: 72px 28px;
  gap: 16px;
}
.empty__art {
  width: 108px;
  height: 108px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--brand-softer);
  color: var(--brand);
  margin-bottom: 4px;
}
.empty__art svg { width: 44px; height: 44px; }
.empty__title { font-size: var(--fs-h3); font-weight: 650; color: var(--text-1); }
.empty__desc { font-size: var(--fs-sm); color: var(--text-2); max-width: 260px; line-height: 1.7; }
.empty .btn { margin-top: 8px; }

/* ============ 16. 光晕 / 玻璃 ============ */
.glow-orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(64px);
  pointer-events: none;
  z-index: 0;
}

.glass {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.10);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
}

/* ============ 17. 动效 ============ */
@keyframes breath {
  0%, 100% { transform: scale(1); opacity: 0.85; }
  50% { transform: scale(1.06); opacity: 1; }
}
@keyframes breathe-dots {
  0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
  40% { transform: scale(1); opacity: 1; }
}
@keyframes fade-up {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes shimmer {
  0% { background-position: -400px 0; }
  100% { background-position: 400px 0; }
}

.breath { animation: breath 2.4s var(--ease) infinite; }

/* AI 生成呼吸状态 */
.ai-generating { display: flex; align-items: center; gap: 6px; }
.ai-generating__dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--brand);
  animation: breathe-dots 1.2s var(--ease) infinite;
}
.ai-generating__dot:nth-child(2) { animation-delay: 0.15s; }
.ai-generating__dot:nth-child(3) { animation-delay: 0.3s; }

/* 骨架屏 */
.skeleton {
  border-radius: var(--r-md);
  background: linear-gradient(90deg, var(--surface-2) 25%, var(--surface-3) 50%, var(--surface-2) 75%);
  background-size: 400px 100%;
  animation: shimmer 1.4s linear infinite;
}

.fade-up { animation: fade-up 0.5s var(--ease-out) both; }
.fade-up--1 { animation-delay: 0.03s; }
.fade-up--2 { animation-delay: 0.08s; }
.fade-up--3 { animation-delay: 0.13s; }

/* 折叠区 */
.collapse__head {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 4px 0;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.collapse__chevron {
  transition: transform var(--dur) var(--ease);
  color: var(--text-3);
}
.collapse__chevron svg { width: 18px; height: 18px; }
.collapse.is-open .collapse__chevron { transform: rotate(180deg); }
.collapse__body {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows var(--dur-slow) var(--ease);
}
.collapse__body > div { overflow: hidden; }
.collapse.is-open .collapse__body { grid-template-rows: 1fr; }

/* 开关 */
.switch {
  position: relative;
  width: 48px;
  height: 28px;
  border-radius: var(--r-pill);
  background: var(--surface-3);
  transition: background var(--dur) var(--ease);
  flex: 0 0 auto;
}
.switch::after {
  content: '';
  position: absolute;
  top: 3px;
  left: 3px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: #FFFFFF;
  box-shadow: 0 2px 6px rgba(38, 34, 30, 0.14);
  transition: transform var(--dur) var(--ease-out);
}
.switch.is-on { background: var(--gradient); }
.switch.is-on::after { transform: translateX(20px); }

/* 复选框（圆润） */
.check {
  width: 26px;
  height: 26px;
  border-radius: 9px;
  border: 2px solid var(--border-strong);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  color: transparent;
  transition: all var(--dur-fast) var(--ease);
  -webkit-tap-highlight-color: transparent;
}
.check svg { width: 15px; height: 15px; }
.check.is-done {
  background: var(--gradient);
  border-color: transparent;
  color: #FFFFFF;
}

/* stepper 步进器 */
.stepper {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--r-pill);
  padding: 3px;
}
.stepper__btn {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-2);
  transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
}
.stepper__btn:active { background: var(--surface-3); color: var(--text-1); }
.stepper__btn svg { width: 16px; height: 16px; }
.stepper__val { min-width: 40px; text-align: center; font-weight: 650; font-variant-numeric: tabular-nums; }

/* Toast */
.toast {
  position: fixed;
  left: 50%;
  bottom: 110px;
  transform: translateX(-50%) translateY(16px);
  padding: 11px 22px;
  border-radius: var(--r-pill);
  font-size: var(--fs-sm);
  font-weight: 600;
  color: #FFFFFF;
  background: var(--gradient);
  box-shadow: var(--shadow-primary);
  opacity: 0;
  pointer-events: none;
  transition: all var(--dur) var(--ease-out);
  z-index: 100;
  white-space: nowrap;
}
.toast.is-show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* 分割线 */
.divider { height: 1px; background: var(--border); border: 0; }

/* 工具 */
.is-hidden { display: none !important; }
.sr-only {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}

/* ============ 18.5 语义色分工规范（跨模块统一） ============ */
/*
  模块色：
    训练 = --expense-red（珊瑚橙）
    饮水 = --goal-blue（宝蓝）
    睡眠 = --purple（柔和紫）
    饮食 = --life-green（鼠尾草绿）
    久坐/姿态 = --purple（柔和紫）
    养生/功法 = --life-green（鼠尾草绿）
    吃药 = --purple（柔和紫）
    记账 = --goal-blue（宝蓝）
    专注/品牌 = --brand（克莱因蓝）
  状态色（跨模块统一）：
    达标/完成 = --life-green
    预警/超支 = --pause-amber
    品牌/主按钮 = --brand
*/

/* ============ 19. 条目/图标组件（全局唯一标准） ============ */
/* 图标容器：.icon-box 为全局唯一图标容器标准 */
.icon-box {
  width: var(--icon-md);
  height: var(--icon-md);
  border-radius: var(--r-icon);
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  background: var(--surface-2);
  color: var(--text-2);
}
.icon-box svg { width: 19px; height: 19px; }
.icon-box--lg { width: var(--icon-lg); height: var(--icon-lg); }
.icon-box--lg svg { width: 22px; height: 22px; }
.icon-box--sm { width: var(--icon-sm); height: var(--icon-sm); }
.icon-box--sm svg { width: 16px; height: 16px; }
/* 语义色变体 */
.icon-box--strength { background: var(--expense-red-soft); color: var(--expense-red); }
.icon-box--water { background: var(--goal-blue-soft); color: var(--goal-blue); }
.icon-box--sleep { background: var(--purple-soft); color: var(--purple); }
.icon-box--life { background: var(--life-green-soft); color: var(--life-green); }
.icon-box--brand { background: var(--brand-soft); color: var(--brand); }
.icon-box--amber { background: var(--pause-amber-soft); color: var(--pause-amber); }
.icon-box--emotion { background: var(--emotion-soft); color: var(--emotion); }
[data-theme="dark"] .icon-box--strength { color: var(--expense-red); }
[data-theme="dark"] .icon-box--water { color: var(--goal-blue); }
[data-theme="dark"] .icon-box--sleep { color: var(--purple); }
[data-theme="dark"] .icon-box--life { color: var(--life-green); }
[data-theme="dark"] .icon-box--brand { color: var(--brand-strong); }
[data-theme="dark"] .icon-box--amber { color: var(--pause-amber); }
[data-theme="dark"] .icon-box--emotion { color: var(--emotion); }

/* 通用条目骨架：.item-row 为全局唯一条目标准 */
.item-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 4px 0;
}
.item-row__main { flex: 1; min-width: 0; }
.item-row__name {
  font-size: var(--h-name);
  font-weight: 650;
  letter-spacing: -0.01em;
  color: var(--text-1);
}
.item-row__meta {
  font-size: var(--fs-meta);
  color: var(--text-3);
  margin-top: 2px;
  line-height: 1.5;
}
.item-row__val {
  font-size: 15px;
  font-weight: 700;
  color: var(--text-1);
  font-variant-numeric: tabular-nums;
  flex: 0 0 auto;
}

/* ============ 20. 状态/交互类（跨页统一） ============ */
/* 完成态工具类：左侧色条变浅绿 + 绿图标 + 绿文字 + opacity 0.6 */
.is-done { opacity: 0.6; }
.is-done::before { background: var(--life-green) !important; }
.is-done > .icon-box,
.is-done .icon-box {
  background: var(--life-green-soft) !important;
  color: var(--life-green) !important;
}
.is-done .item-row__name { color: var(--life-green) !important; }
.is-done .ev__focus { background: var(--life-green-soft) !important; color: var(--life-green) !important; }
.is-done__note {
  display: flex;
  align-items: center;
  gap: 3px;
  font-size: 11px;
  color: var(--life-green);
  margin-top: 2px;
}
.is-done__note svg { width: 11px; height: 11px; }

/* chip 扩展变体 */
.chip--custom { border-style: dashed; }
.chip--custom.is-active {
  background: var(--brand-soft);
  border-color: var(--brand);
  border-style: solid;
  color: var(--brand);
}
[data-theme="dark"] .chip--custom.is-active { color: var(--brand-strong); }
.chips--my .chip { position: relative; }
.chips--my .chip.is-longpress::after {
  content: '×';
  position: absolute;
  top: -6px;
  right: -6px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--expense-red);
  color: #FFFFFF;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  line-height: 1;
}

/* ============ 21. 跨页联动模式（规范注释） ============ */
/*
  跨页状态同步统一模式：
  1. 数据源：localStorage.setItem('lifeflow-<mod>-<key>', JSON.stringify({date, ...}))
  2. 写入：保存后立即 dispatchEvent(new CustomEvent('<mod>-updated', { detail }))
  3. 读取：消费方 read → 按 date 校验今天 → 应用状态
  4. 监听：addEventListener('<mod>-updated') + addEventListener('storage' 按 key)
     + addEventListener('visibilitychange')（切回页面刷新，防漏事件）
  5. 事件命名：<mod>-updated（train-updated / water-updated / habit-updated）
  6. 数据结构：跨页状态用 {date, typesDone:[类型名], typeTimes:{类型名:HH:MM}, ...}
     代替单纯 {done:[项目名]}（typesDone 适合"按类型聚合"——一个类型完成一次即标完成）
*/

/* 无障碍：减少动效 */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
}
</style>

<script src="../assets/lucide.min.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var toast = $('toast');
  var toastTimer;
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('is-show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove('is-show'); }, 1800);
  }

  /* 主题 */
  var LS_THEME = 'lifeflow-theme';
  var root = document.documentElement;
  function applyTheme(t) {
    root.setAttribute('data-theme', t);
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) { meta.setAttribute('content', t === 'dark' ? '#0D1117' : '#F7F4EF'); }
    var icon = document.querySelector('#theme-toggle i');
    if (icon) { icon.setAttribute('data-lucide', t === 'dark' ? 'sun' : 'moon'); }
    if (window.lucide) { window.lucide.createIcons(); }
  }
  var saved = null;
  try { saved = localStorage.getItem(LS_THEME); } catch (e) {}
  if (saved) { applyTheme(saved); }
  $('theme-toggle').addEventListener('click', function () {
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    try { localStorage.setItem(LS_THEME, next); } catch (e) {}
  });

  /* 返回（关闭陪练） */
  document.addEventListener('click', function (e) {
    var hrefEl = e.target.closest('[data-href]');
    if (hrefEl && hrefEl.getAttribute('data-href')) {
      location.href = hrefEl.getAttribute('data-href');
      return;
    }
  });

  /* 工具 */
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  var chatScroll = $('chat-scroll');
  var inputEl = $('chat-input');
  var sendBtn = $('send-btn');
  var micBtn = $('mic-btn');
  var statusEl = $('assistant-status');
  var statusText = $('assistant-status-text');

  function scrollBottom() { chatScroll.scrollTop = chatScroll.scrollHeight; }

  function appendMsg(role, innerHTML, chips) {
    var wrap = document.createElement('div');
    wrap.className = 'msg msg--' + role;
    var bubble = document.createElement('div');
    bubble.className = 'msg__bubble';
    bubble.innerHTML = innerHTML;
    wrap.appendChild(bubble);
    if (chips && chips.length) {
      var row = document.createElement('div');
      row.className = 'ask-chips';
      chips.forEach(function (c) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'ask-chip';
        b.textContent = c.label;
        b.setAttribute('data-ask', c.val);
        row.appendChild(b);
      });
      wrap.appendChild(row);
    }
    chatScroll.appendChild(wrap);
    if (window.lucide) { window.lucide.createIcons(); }
    scrollBottom();
    /* ⚠ 记录的是**整个 .msg 外壳**（不是 .msg__bubble 的内容）：
       追问 chip 是挂在 .msg 下面的 .ask-chips，只存 bubble 的话
       冷启动回填完，"减脂到 22%"那几个 chip 就没了 —— 用户再也点不出预览卡（实测踩到）。 */
    recordMsg(role, wrap.outerHTML);
    return wrap;
  }

  function setThinking(on) {
    if (on) {
      statusEl.classList.add('is-thinking');
      statusText.textContent = '思考中';
    } else {
      statusEl.classList.remove('is-thinking');
      statusText.textContent = '在线';
    }
  }

  function thinkThen(fn) {
    setThinking(true);
    var bubble = appendMsg('ai', '<div class="ai-generating"><span class="ai-generating__dot"></span><span class="ai-generating__dot"></span><span class="ai-generating__dot"></span></div>');
    bubble.classList.add('msg--thinking');
    setTimeout(function () {
      bubble.remove();
      setThinking(false);
      fn();
      scrollBottom();
    }, 1500);
  }

  /* 追问补槽 */
  function askSlot() {
    appendMsg('ai', '好的，我们慢慢来。你想达成什么样的状态？', [
      { label: '减脂到 22%', val: '减脂到 22%' },

    ]);

  /* 预览卡片 */
  function krRow(v, num, unit) {

      '<input class="pv-input" type="text" value="' + esc(v) + '" placeholder="关键结果描述">' +

      '<button type="button" class="pv-remove" data-action="remove-row" aria-label="删除"><i data-lucide="trash-2"></i></button>' +

  function previewCardHTML() {

      '<div class="pv-field">' +

        '<div class="pv-list">' +
          krRow('累计有氧训练', '24', '次') +

      '</div>' +

        '<button type="button" class="strategy__head" data-action="toggle-strategy" aria-expanded="false">' +
          '<span class="strategy__icon"><i data-lucide="sparkles"></i></span>' +
          '<span class="strategy__label">策略推导说明</span>' +
          '<span class="strategy__badge">陪练生成</span>' +
          '<span class="strategy__chevron"><i data-lucide="chevron-down"></i></span>' +
        '</button>' +
        '<div class="strategy__body"><div class="strategy__inner"><div class="strategy__panel">' +
          '<textarea class="pv-textarea">减脂的核心是「热量缺口 + 可持续性」。以有氧训练建立基础消耗，力量训练保留肌肉。拆成「每周 4 次有氧 + 2 次力量」的节奏更容易做下去 3 个月。</textarea>' +
        '</div></div></div>' +
      '</div>' +
      '<div class="pv-actions">' +
        '<button type="button" class="btn btn--ghost btn--sm" data-action="cancel-create">取消</button>' +
        '<button type="button" class="btn btn--primary btn--sm" data-action="confirm-create"><i data-lucide="check"></i> 确认创建</button>' +
      '</div>' +
    '</div>';
  }

  function showPreview() {
    var wrap = document.createElement('div');
    wrap.className = 'msg msg--card fade-up';
    wrap.innerHTML = previewCardHTML();
    /* 记录/回填要能对上"是哪一张草稿卡" —— id 先挂在卡上，真正落盘时再写入盘 */
    var card = wrap.querySelector('.pv-card');
    if (card) {
      if (!activeDraftId) { activeDraftId = 'gd' + Date.now(); }
      card.setAttribute('data-draft-id', activeDraftId);
    }
    chatScroll.appendChild(wrap);
    if (window.lucide) { window.lucide.createIcons(); }
    scrollBottom();
    return wrap;
  }

  /* ══════════════════════════════════════════════════════════════
     持久化（本次新增）—— 改造前这一页**没有任何落盘**：
       · 对话流一刷新就没（连"记一笔"里说的内容都留不下）
       · 「添加关键结果 / 添加行动」只在 DOM 里插一行
       · 「确认创建」只弹遮罩 + 追加一句回复，**目标草稿直接丢掉**

       lifeflow-assistant-goal-drafts = { v:1, items:[ {
         id, createdAt, updatedAt, status: 'draft'|'created',
         text, vision, strategy,
         krs:     [ { text, num, unit } ],
         actions: [ { text, time } ]
       } ] }

     ⚠ 归属说明（按作业要求，**没有**跨域写别人的 key）：
       这份草稿本质上是"方向域"的 goal（愿景/关键结果/行动）。
       但方向域（goals / goal-create / goal-detail）不在我的范围内、可能正在被其它 agent 改，
       所以我**不写** `lifeflow-goal-items` 之类别人的 key，只写本域自己的 key，
       然后广播 `assistant-goal-draft-updated` + `assistant-goal-created`。
       → 建议由方向域来决定怎么消费（把它并入 goal schema，或直接就认这个 key）。

       lifeflow-assistant-chat = { v:1, items:[ { role:'ai'|'user', html } ] }
       （聊天气泡里的 HTML 由本页自己生成，回填时原样插回 ⟹ 与原渲染一致）

     事件名：`assistant-goal-updated`（草稿写盘后广播；确认创建时 detail.status==='created'）
             `assistant-chat-updated`（聊天记录写盘后广播）
     ══════════════════════════════════════════════════════════════ */
  var K_DRAFTS = 'lifeflow-assistant-goal-drafts';
  var K_CHAT = 'lifeflow-assistant-chat';
  var SCHEMA_V = 1;
  var activeDraftId = null;
  var restoring = false;   /* 回填期间不记录、不重渲染，避免自触发 */

  function stamp() {
    var n = new Date();
    var p = function (x) { return (x < 10 ? '0' : '') + x; };
    return n.getFullYear() + '-' + p(n.getMonth() + 1) + '-' + p(n.getDate()) +
      ' ' + p(n.getHours()) + ':' + p(n.getMinutes());
  }
  function loadJSON(key, fallback) {
    try {
      var raw = localStorage.getItem(key);
      if (raw) {
        var d = JSON.parse(raw);
        if (d && d.v === SCHEMA_V && Array.isArray(d.items)) { return d; }
      }
    } catch (e) { /* 存储不可用 → 退化为空表，页面照常能聊 */ }
    return fallback;
  }
  function persist(key, items) {
    try {
      localStorage.setItem(key, JSON.stringify({ v: SCHEMA_V, items: items }));
    } catch (e) { /* 忽略 */ }
  }
  /* ⚠ 事件名必须写成**字面量**：一是全站口径一眼可查，二是 verify-persist-page 的静态检查
     用正则找 `CustomEvent('<mod>-updated'`，把事件名藏在变量里会被判成"缺广播更新事件"（踩过）。 */
  function broadcastDraft(detail) {
    window.dispatchEvent(new CustomEvent('assistant-goal-updated', { detail: detail }));
  }
  function broadcastChat(detail) {
    window.dispatchEvent(new CustomEvent('assistant-chat-updated', { detail: detail }));
  }
  function loadDrafts() { return loadJSON(K_DRAFTS, { v: SCHEMA_V, items: [] }); }

  /* 聊天记录：存**整个 .msg 元素的 HTML**（role + 气泡 + 追问 chip 一起存），
     回填时原样插回 ⟹ 与原渲染一致，chip 也不会丢。
     ⚠ 旧格式（只存 bubble 内容）读进来也能显示，只是少了 chip。 */
  function loadChat() { return loadJSON(K_CHAT, { v: SCHEMA_V, items: [] }); }
  function recordMsg(role, msgHtml) {
    if (restoring) { return; }
    var d = loadChat();
    d.items.push({ role: role, html: msgHtml });
    persist(K_CHAT, d.items);
    broadcastChat({ items: d.items });
  }

  /* 预览卡 ↔ 草稿对象 的双向映射（字段直接在 DOM 上读写，保证"用户改了什么就存什么"） */
  function draftFromCard(card, base) {
    var d = base || {};
    d.vision = card.querySelector('.pv-input--full') ? card.querySelector('.pv-input--full').value : (d.vision || '');
    d.strategy = card.querySelector('.pv-textarea') ? card.querySelector('.pv-textarea').value : (d.strategy || '');
    var fields = card.querySelectorAll('.pv-field');
    var prevUnit = '';
    d.krs = [];
    fields.forEach(function (f) {
      var label = f.querySelector('.pv-label');
      if (!label || label.textContent.indexOf('关键结果') < 0) { return; }
      f.querySelectorAll('.pv-row').forEach(function (row) {
        var ins = row.querySelectorAll('.pv-input');
        /* ⚠ 单位不在 .pv-input 里，它是独立的 <span class="pv-unit">。
           第一版按 ins[2] 取 ⟹ 单位永远是空串（实测存进去的 krs[0].unit === ''）。
           新加的行走 krRow('', '', '次') —— 它**自带单位**，所以行内一定有 .pv-unit；
           真取不到就沿用上一行的单位兜底。 */
        var uEl = row.querySelector('.pv-unit');
        var unit = uEl ? uEl.textContent.trim() : '';
        if (unit) { prevUnit = unit; } else { unit = prevUnit; }
        d.krs.push({
          text: ins[0] ? ins[0].value : '',
          num: ins[1] ? ins[1].value : '',
          unit: unit
        });
      });
    });
    d.actions = [];
    fields.forEach(function (f) {
      var label = f.querySelector('.pv-label');
      if (!label || label.textContent.indexOf('行动') < 0) { return; }
      f.querySelectorAll('.pv-row').forEach(function (row) {
        var ins = row.querySelectorAll('.pv-input');
        d.actions.push({ text: ins[0] ? ins[0].value : '', time: ins[1] ? ins[1].value : '' });
      });
    });
    return d;
  }
  /* 点「添加关键结果 / 添加行动」后：把那**一张卡**的当前状态写回盘（不是整页重渲染） */
  function saveCard(card, status) {
    if (!card || restoring) { return; }
    var all = loadDrafts();
    var id = card.getAttribute('data-draft-id');
    if (!id) { id = 'gd' + Date.now(); card.setAttribute('data-draft-id', id); activeDraftId = id; }
    var idx = -1;
    all.items.forEach(function (x, i) { if (String(x.id) === String(id)) { idx = i; } });
    var base = idx >= 0 ? all.items[idx] : { id: id, createdAt: stamp(), text: '', vision: '', strategy: '', krs: [], actions: [] };
    var next = draftFromCard(card, base);
    next.status = status || base.status || 'draft';
    next.updatedAt = stamp();
    if (idx >= 0) { all.items[idx] = next; } else { all.items.push(next); }
    persist(K_DRAFTS, all.items);
    broadcastDraft({ draft: next, items: all.items });
  }
  /* 从盘里渲染一张预览卡（回填用）—— 复用 previewCardHTML 的同一套 class 结构 */
  function previewCardHTMLFrom(d) {
    var html = '<div class="pv-card" data-draft-id="' + esc(d.id) + '">' +
      '<div class="pv-head"><i data-lucide="sparkles"></i> 陪练已生成初稿，可微调后确认</div>' +
      '<div class="pv-field">' +
        '<div class="pv-label"><i data-lucide="compass"></i> 愿景 · 一句话</div>' +
        '<input class="pv-input pv-input--full" type="text" value="' + esc(d.vision || '') + '">' +
      '</div>' +
      '<div class="pv-field">' +
        '<div class="pv-label"><i data-lucide="target"></i> 量化目标 · 关键结果</div>' +
        '<div class="pv-list">' +
          (d.krs || []).map(function (k) { return krRow(k.text, k.num, k.unit); }).join('') +
        '</div>' +
        '<button type="button" class="pv-add" data-action="add-kr"><i data-lucide="plus"></i> 添加关键结果</button>' +
      '</div>' +
      '<div class="pv-field">' +
        '<div class="pv-label"><i data-lucide="list-checks"></i> 行动 · 今日与近期</div>' +
        '<div class="pv-list">' +
          (d.actions || []).map(function (a) { return actionRow(a.text, a.time); }).join('') +
        '</div>' +
        '<button type="button" class="pv-add" data-action="add-action"><i data-lucide="plus"></i> 添加行动</button>' +
      '</div>' +
      '<div class="strategy" data-strategy>' +
        '<button type="button" class="strategy__head" data-action="toggle-strategy" aria-expanded="false">' +
          '<span class="strategy__icon"><i data-lucide="sparkles"></i></span>' +
          '<span class="strategy__label">策略推导说明</span>' +
          '<span class="strategy__badge">陪练生成</span>' +
          '<span class="strategy__chevron"><i data-lucide="chevron-down"></i></span>' +
        '</button>' +
        '<div class="strategy__body"><div class="strategy__inner"><div class="strategy__panel">' +
          '<textarea class="pv-textarea">' + esc(d.strategy || '') + '</textarea>' +
        '</div></div></div>' +
      '</div>' +
      '<div class="pv-actions">' +
        '<button type="button" class="btn btn--ghost btn--sm" data-action="cancel-create">取消</button>' +
        '<button type="button" class="btn btn--primary btn--sm" data-action="confirm-create"><i data-lucide="check"></i> 确认创建</button>' +
      '</div>' +
    '</div>';
    return html;
  }
  /* 草稿数据变了 → 把盘里最新状态写回它自己那张卡（关键结果/行动行按条数对齐后整体重建） */
  function refreshDraftCard(id) {
    if (!id) { return; }
    var all = loadDrafts();
    var hit = all.items.filter(function (x) { return String(x.id) === String(id); })[0];
    if (!hit) { return; }
    var card = document.querySelector('.pv-card[data-draft-id="' + id + '"]');
    if (!card) { return; }
    var wasThinking = restoring;
    restoring = true;
    card.outerHTML = previewCardHTMLFrom(hit);
    restoring = wasThinking;
    if (window.lucide) { window.lucide.createIcons(); }
  }

  /* 回填：把上次的对话与"还没确认的草稿"放回页面。
     ⚠ 两个坑（都踩过，改前版本直接把对话刷成了 105 条）：
       ① **必须置 restoring 标记**：回填时 appendChild 不能走 recordMsg，
          否则"读出来 → 再写回去"会自己喂自己，条数指数增长。
       ② **回填必须幂等**：加一个 data-restored 标记，重复调用不重复插。
       另外本页**不监听 visibilitychange** —— 它在 headless/切回场景下会触发 reload，
       而 reload 又会再回填一次，是上面那个爆炸的第二推力。跨页联动只靠 storage 事件。 */
  var restored = false;
  (function restoreSession() {
    if (restored) { return; }
    var chat = loadChat();
    if (!chat.items.length) { return; }
    restored = true;
    restoring = true;
    chat.items.forEach(function (m) {
      /* 存的是整个 .msg 元素（含 chip）；旧格式的裸气泡也能插回来 */
      chatScroll.insertAdjacentHTML('beforeend',
        /class="msg\b/.test(m.html) ? m.html : '<div class="msg msg--' + m.role + '" data-restored="1"><div class="msg__bubble">' + m.html + '</div></div>');
    });
    restoring = false;
    var drafts = loadDrafts();
    var open = null;
    drafts.items.forEach(function (x) { if (x.status !== 'created') { open = x; } });
    if (open) {
      activeDraftId = open.id;
      var cardWrap = document.createElement('div');
      cardWrap.className = 'msg msg--card';
      cardWrap.setAttribute('data-restored', '1');
      cardWrap.innerHTML = previewCardHTMLFrom(open);
      chatScroll.appendChild(cardWrap);
    }
    if (window.lucide) { window.lucide.createIcons(); }
    scrollBottom();
  })();

  /* 跨页联动：别的页改了草稿 → 刷新对应卡片 */
  window.addEventListener('assistant-goal-updated', function (e) {
    if (e && e.detail && e.detail.draft && String(e.detail.draft.id) === String(activeDraftId)) { return; }
    refreshDraftCard(activeDraftId);
  });
  window.addEventListener('storage', function (e) {
    if (e.key === K_DRAFTS) { refreshDraftCard(activeDraftId); }
  });

  /* 路由 */
  function route(text) {
    if (/目标|减脂|增肌|健身|入睡|睡眠|早睡|想达成/.test(text)) {
      thinkThen(askSlot);
    } else if (/记一笔|记账|花/.test(text)) {
      thinkThen(function () {
        appendMsg('ai', '好的，记一笔什么？比如「午饭 28 元」，我帮你归档到记账里。');
      });
    } else if (/推进回顾/.test(text)) {
      thinkThen(function () {
        appendMsg('ai', '好，我们快速过一遍今天的推进——哪些在往前，哪些需要调整一下节奏。');
      });
    } else if (/专注/.test(text)) {
      thinkThen(function () {
        appendMsg('ai', '好，准备开始专注格。建议从一个 25 分钟的专注格开始，我会帮你安静地计时。');
      });
    } else if (/饮水|喝水|水|渴/.test(text)) {
      thinkThen(function () {
        appendMsg('ai', '饮水是白天的事，今天目标 8 杯。去饮水页记一杯，我会帮你盯进度。');
      });
    } else if (/久坐|起身|坐|酸/.test(text)) {
      thinkThen(function () {
        appendMsg('ai', '坐久了记得起来动一动。去久坐页记一次起身，建议每小时打断一次。');
      });
    } else if (/功法|养生|八段锦|站桩|冥想|拉伸/.test(text)) {
      thinkThen(function () {
        appendMsg('ai', '练后酸痛日优先做站桩或八段锦，睡前适合冥想。去功法页记时长，我帮你攒天数。');
      });
    } else if (/药|吃药|服药/.test(text)) {
      thinkThen(function () {
        appendMsg('ai', '今天有药没吃吗？去吃药页看今日应服，我帮你到点提醒。');
      });
    } else if (/饮食|三餐|吃什么|吃|食材/.test(text)) {
      thinkThen(function () {
        appendMsg('ai', '三餐记了吗？去饮食页记一餐，帮你拆成食材种类，看看今天够不够 12 种。');
      });
    } else {
      thinkThen(function () {
        appendMsg('ai', '我记下了「' + esc(text) + '」。想让我帮你拆成目标，还是先记一笔、或者做一次推进回顾？');
      });
    }
  }

  function handleSend(text) {
    appendMsg('user', esc(text));
    route(text);
  }

  sendBtn.addEventListener('click', function () {
    var t = inputEl.value.trim();
    if (!t) { showToast('先说点什么吧'); inputEl.focus(); return; }
    inputEl.value = '';
    handleSend(t);
  });
  inputEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendBtn.click();
    }
  });

  /* 快捷指令 chips */
  document.querySelectorAll('.chat-chip').forEach(function (chip) {
    chip.addEventListener('click', function () {
      var cmd = chip.getAttribute('data-command');
      if (cmd === '快速记录') { location.href = 'quick-note.html'; return; }
      handleSend(cmd);
    });
  });

  /* 语音（演示态） */
  micBtn.addEventListener('click', function () {
    var recording = micBtn.classList.toggle('is-recording');
    if (recording) {
      inputEl.placeholder = '正在聆听…';
      showToast('语音输入演示：点击结束');
    } else {
      inputEl.placeholder = '说说你想做的事…';
      inputEl.value = '新建目标';
      showToast('已识别：新建目标');
    }
  });

  /* 事件委托：追问 chips / 预览卡片交互 */
  document.addEventListener('click', function (e) {
    var ask = e.target.closest('[data-ask]');
    if (ask) {
      var val = ask.getAttribute('data-ask');
      appendMsg('user', esc(val));
      thinkThen(showPreview);
      return;
    }
    var rm = e.target.closest('[data-action="remove-row"]');
    if (rm) {
      var rmCard = rm.closest('.pv-card');
      rm.closest('.pv-row').remove();
      saveCard(rmCard);          /* 删一行也要落盘 */
      return;
    }
    var addKr = e.target.closest('[data-action="add-kr"]');
    if (addKr) {
      var krList = addKr.previousElementSibling;
      krList.insertAdjacentHTML('beforeend', krRow('', '', '次'));
      if (window.lucide) { window.lucide.createIcons(); }
      scrollBottom();
      saveCard(addKr.closest('.pv-card'));   /* 新增一行 → 立刻落盘（改造前只在 DOM 里插） */
      return;
    }
    var addAction = e.target.closest('[data-action="add-action"]');
    if (addAction) {
      var aList = addAction.previousElementSibling;
      aList.insertAdjacentHTML('beforeend', actionRow('', ''));
      if (window.lucide) { window.lucide.createIcons(); }
      scrollBottom();
      saveCard(addAction.closest('.pv-card'));
      return;
    }
    var toggle = e.target.closest('[data-action="toggle-strategy"]');
    if (toggle) {
      var strategy = toggle.closest('.strategy');
      var open = strategy.classList.toggle('is-open');
      toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      return;
    }
    var confirm = e.target.closest('[data-action="confirm-create"]');
    if (confirm) {
      var cCard = confirm.closest('.pv-card');
      /* 确认创建 → 把这张卡的最终内容落盘并标记为 created，再广播（改造前直接丢掉） */
      saveCard(cCard, 'created');
      if (window.LF && window.LF.toast) { window.LF.toast('目标已创建'); }
      cCard.querySelectorAll('.btn').forEach(function (b) { b.disabled = true; });
      var overlay = $('success-overlay');
      overlay.classList.add('is-show');
      setTimeout(function () {
        overlay.classList.remove('is-show');
        appendMsg('ai', '目标已创建，今日行动已为你排好。随时来找我推进回顾进度，或继续安排下一件事。');
      }, 1400);
      return;
    }
    var cancel = e.target.closest('[data-action="cancel-create"]');
    if (cancel) {
      cancel.closest('.pv-card').querySelectorAll('.btn').forEach(function (b) { b.disabled = true; });
      appendMsg('ai', '好的，先不创建。你可以随时重新开始，我一直都在。');
      return;
    }
  });

  if (window.lucide) { window.lucide.createIcons(); }
})();
</script>

  .strategy { margin-top: 14px; border-radius: var(--r-md); overflow: hidden; }

  /* 底部输入区 */
  .chat-input {
