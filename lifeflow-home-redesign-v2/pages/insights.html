    <title>数据洞察</title>
    <style id="theme-vars">
/* LifeFlow 2.0 — 极简克制设计系统
   第一性原理：目标驱动的个人生活操作系统
   视觉原则：大留白 · 细线分层 · 单主色 · 克制圆角 · 精确排版
   表面模型：静态内容用边框/背景分层，浮动层才允许阴影
   色彩模型：石墨黑主色 + 中性灰阶 + 语义状态色（无模块彩）
*/

/* === LIGHT MODE（日间 · 极简克制） === */
:root {
  /* SURFACE & TEXT */
  --lifeflow-background: #F6F6F7;
  --lifeflow-foreground: #1A1A1E;
  --lifeflow-card: #FFFFFF;
  --lifeflow-card-foreground: #1A1A1E;
  --lifeflow-popover: #FFFFFF;
  --lifeflow-popover-foreground: #1A1A1E;
  --lifeflow-muted: #F0F0F2;
  --lifeflow-muted-foreground: #6E6E76;
  --lifeflow-border: rgba(26,26,30,0.10);
  --lifeflow-border-light: rgba(26,26,30,0.055);
  --lifeflow-border-dashed: rgba(26,26,30,0.16);
  --lifeflow-input: rgba(26,26,30,0.08);
  --lifeflow-ring: #1A1A1E;

  /* BRAND — 单主色（石墨黑，克制使用） */
  --lifeflow-primary: #1A1A1E;
  --lifeflow-primary-hover: #000000;
  --lifeflow-primary-light: rgba(26,26,30,0.06);
  --lifeflow-primary-foreground: #FFFFFF;

  /* PROGRESS */
  --lifeflow-knit-thread: #1A1A1E;
  --lifeflow-knit-thread-completed: #16A34A;
  --lifeflow-knit-thread-partial: #D97706;
  --lifeflow-knit-bg: #EDEDEF;
  --lifeflow-knit-grid: rgba(26,26,30,0.07);

  /* STATE — 语义状态色（仅用于状态，不用于身份标识） */
  --state-success: #16A34A;
  --state-success-light: rgba(22,163,74,0.08);
  --state-warning: #D97706;
  --state-warning-light: rgba(217,119,6,0.08);
  --state-error: #DC2626;
  --state-error-light: rgba(220,38,38,0.08);
  --state-info: #2563EB;
  --state-info-light: rgba(37,99,235,0.08);

  /* TEXT */
  --lifeflow-text-primary: #1A1A1E;
  --lifeflow-text-secondary: #55555E;
  --lifeflow-text-tertiary: #8A8A93;
  --lifeflow-text-disabled: #B8B8BF;
  --lifeflow-text-inverse: #FFFFFF;

  /* SHADOWS — 静态表面走边框，浮动层才用阴影（alpha <= 0.06） */
  --lifeflow-shadow-1: 0 1px 2px rgba(26,26,30,0.04);
  --lifeflow-shadow-2: 0 4px 16px rgba(26,26,30,0.06);
  --lifeflow-shadow-3: 0 12px 32px rgba(26,26,30,0.10);
  --lifeflow-shadow-knit: none;

  /* TAB BAR — 白底细顶线 */
  --lifeflow-tabbar-bg: rgba(255,255,255,0.92);
  --lifeflow-tabbar-blur: 16px;
  --lifeflow-tabbar-blur-saturate: 100%;

  /* AI BALL */
  --lifeflow-ai-ball: #1A1A1E;

  /* TYPOGRAPHY — 精确排版：收紧字距、克制字重 */
  --lifeflow-font-display: -apple-system, BlinkMacSystemFont, "SF Pro SC", "PingFang SC", "Noto Sans SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  --lifeflow-font-body: -apple-system, BlinkMacSystemFont, "SF Pro SC", "PingFang SC", "Noto Sans SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  --lifeflow-font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;

  --lifeflow-font-size-display: 32px;
  --lifeflow-font-size-h1: 26px;
  --lifeflow-font-size-h2: 20px;
  --lifeflow-font-size-h3: 16px;
  --lifeflow-font-size-body: 15px;
  --lifeflow-font-size-sm: 13px;
  --lifeflow-font-size-caption: 12px;

  /* SPACING */
  --lifeflow-space-xs: 4px;
  --lifeflow-space-sm: 8px;
  --lifeflow-space-md: 12px;
  --lifeflow-space-lg: 16px;
  --lifeflow-space-xl: 24px;
  --lifeflow-space-2xl: 32px;

  /* RADIUS — 克制圆角：sm 4 / md 8 / lg 12 / full */
  --lifeflow-radius-sm: 4px;
  --lifeflow-radius-md: 8px;
  --lifeflow-radius-lg: 12px;
  --lifeflow-radius-xl: 12px;
  --lifeflow-radius-full: 9999px;

  /* PORTABLE ALIASES */
  --background: var(--lifeflow-background);
  --foreground: var(--lifeflow-foreground);
  --card: var(--lifeflow-card);
  --card-foreground: var(--lifeflow-card-foreground);
  --popover: var(--lifeflow-popover);
  --popover-foreground: var(--lifeflow-popover-foreground);
  --primary: var(--lifeflow-primary);
  --primary-foreground: var(--lifeflow-primary-foreground);
  --muted: var(--lifeflow-muted);
  --muted-foreground: var(--lifeflow-muted-foreground);
  --border: var(--lifeflow-border);
  --input: var(--lifeflow-input);
  --ring: var(--lifeflow-ring);
  --radius-sm: var(--lifeflow-radius-sm);
  --radius-md: var(--lifeflow-radius-md);
  --radius-lg: var(--lifeflow-radius-lg);
  --color-background: var(--lifeflow-background);
  --color-foreground: var(--lifeflow-foreground);
  --color-card: var(--lifeflow-card);
  --color-card-foreground: var(--lifeflow-card-foreground);
  --color-popover: var(--lifeflow-popover);
  --color-popover-foreground: var(--lifeflow-popover-foreground);
  --color-primary: var(--lifeflow-primary);
  --color-primary-foreground: var(--lifeflow-primary-foreground);
  --color-muted: var(--lifeflow-muted);
  --color-muted-foreground: var(--lifeflow-muted-foreground);
  --color-border: var(--lifeflow-border);
  --color-input: var(--lifeflow-input);
  --color-ring: var(--lifeflow-ring);
  --color-text-primary: var(--lifeflow-text-primary);
  --color-text-secondary: var(--lifeflow-text-secondary);
  --color-text-tertiary: var(--lifeflow-text-tertiary);
  --color-text-disabled: var(--lifeflow-text-disabled);
  --color-surface-card: var(--lifeflow-card);
  --color-surface-muted: var(--lifeflow-muted);
}

/* === DARK MODE（夜间 · 深空石墨） === */
.dark {
  --lifeflow-background: #0E0E11;
  --lifeflow-foreground: #F2F2F4;
  --lifeflow-card: #16161A;
  --lifeflow-card-foreground: #F2F2F4;
  --lifeflow-popover: #1C1C21;
  --lifeflow-popover-foreground: #F2F2F4;
  --lifeflow-muted: #1E1E23;
  --lifeflow-muted-foreground: rgba(242,242,244,0.55);
  --lifeflow-border: rgba(255,255,255,0.10);
  --lifeflow-border-light: rgba(255,255,255,0.06);
  --lifeflow-border-dashed: rgba(255,255,255,0.18);
  --lifeflow-input: rgba(255,255,255,0.10);
  --lifeflow-ring: #F2F2F4;

  --lifeflow-primary: #F2F2F4;
  --lifeflow-primary-hover: #FFFFFF;
  --lifeflow-primary-light: rgba(255,255,255,0.09);
  --lifeflow-primary-foreground: #0E0E11;

  --lifeflow-knit-thread: #F2F2F4;
  --lifeflow-knit-thread-completed: #34D399;
  --lifeflow-knit-thread-partial: #FBBF24;
  --lifeflow-knit-bg: rgba(255,255,255,0.10);
  --lifeflow-knit-grid: rgba(255,255,255,0.07);

  --state-success: #34D399;
  --state-success-light: rgba(52,211,153,0.12);
  --state-warning: #FBBF24;
  --state-warning-light: rgba(251,191,36,0.12);
  --state-error: #F87171;
  --state-error-light: rgba(248,113,113,0.12);
  --state-info: #60A5FA;
  --state-info-light: rgba(96,165,250,0.12);

  --lifeflow-text-primary: #F2F2F4;
  --lifeflow-text-secondary: rgba(242,242,244,0.68);
  --lifeflow-text-tertiary: rgba(242,242,244,0.42);
  --lifeflow-text-disabled: rgba(242,242,244,0.28);
  --lifeflow-text-inverse: #0E0E11;

  --lifeflow-shadow-1: 0 1px 2px rgba(0,0,0,0.30);
  --lifeflow-shadow-2: 0 4px 16px rgba(0,0,0,0.40);
  --lifeflow-shadow-3: 0 12px 32px rgba(0,0,0,0.55);
  --lifeflow-shadow-knit: none;

  --lifeflow-tabbar-bg: rgba(14,14,17,0.88);
  --lifeflow-tabbar-blur: 16px;
  --lifeflow-tabbar-blur-saturate: 100%;

  --lifeflow-ai-ball: #F2F2F4;
}

/* === TYPOGRAPHY UTILITY CLASSES === */
.lf-display {
  font-family: var(--lifeflow-font-display);
  font-size: var(--lifeflow-font-size-display);
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.2;
}

.lf-h1 {
  font-family: var(--lifeflow-font-display);
  font-size: var(--lifeflow-font-size-h1);
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.25;
}

.lf-h2 {
  font-family: var(--lifeflow-font-display);
  font-size: var(--lifeflow-font-size-h2);
  font-weight: 600;
  letter-spacing: -0.015em;
  line-height: 1.3;
}

.lf-h3 {
  font-family: var(--lifeflow-font-body);
  font-size: var(--lifeflow-font-size-h3);
  font-weight: 600;
  letter-spacing: -0.01em;
  line-height: 1.4;
}

.lf-body {
  font-family: var(--lifeflow-font-body);
  font-size: var(--lifeflow-font-size-body);
  font-weight: 400;
  line-height: 1.55;
}

.lf-body-sm {
  font-family: var(--lifeflow-font-body);
  font-size: var(--lifeflow-font-size-sm);
  font-weight: 400;
  line-height: 1.5;
}

.lf-caption {
  font-family: var(--lifeflow-font-body);
  font-size: var(--lifeflow-font-size-caption);
  font-weight: 400;
  line-height: 1.5;
}

.lf-mono {
  font-family: var(--lifeflow-font-mono);
  font-size: var(--lifeflow-font-size-sm);
  font-weight: 400;
  line-height: 1.6;
}

/* === PROGRESS BAR（细胶囊） === */
.knit-track {
  position: relative;
  height: 5px;
  border-radius: var(--lifeflow-radius-full);
  overflow: hidden;
  background: var(--lifeflow-knit-bg);
}

.knit-fill {
  position: absolute;
  left: 0;
  top: 0;
  height: 100%;
  border-radius: var(--lifeflow-radius-full);
  background: var(--lifeflow-knit-thread);
  z-index: 2;
  transition: width 0.5s ease-in-out;
}

.knit-fill--done { background: var(--lifeflow-knit-thread-completed); }
.knit-fill--partial { background: var(--lifeflow-knit-thread-partial); }

.knit-yarn { display: none; }

.knit-percent {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  z-index: 4;
  font-family: var(--lifeflow-font-body);
  font-size: var(--lifeflow-font-size-sm);
  font-weight: 600;
  color: var(--lifeflow-text-primary);
  line-height: 1;
}

/* === TAB BAR（白底细顶线，跟随模式） === */
.lf-tabbar-glass {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 40;
  border-top: 1px solid var(--lifeflow-border);
  background: var(--lifeflow-tabbar-bg);
  -webkit-backdrop-filter: saturate(var(--lifeflow-tabbar-blur-saturate)) blur(var(--lifeflow-tabbar-blur));
  backdrop-filter: saturate(var(--lifeflow-tabbar-blur-saturate)) blur(var(--lifeflow-tabbar-blur));
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

/* === 极简通用组件 === */
/* 细线分隔列表（克制分割线） */
.lf-list-divider > * + * {
  border-top: 1px solid var(--lifeflow-border-light);
}

/* 卡片：静态内容用 1px 细边框 + 极淡阴影，不靠重阴影 */
.lf-surface {
  background: var(--lifeflow-card);
  border: 1px solid var(--lifeflow-border-light);
  border-radius: var(--lifeflow-radius-lg);
}

/* 数字对齐（时间/金额/进度） */
.lf-tabular {
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum";
}

/* 大数字（统计强调） */
.lf-stat {
  font-family: var(--lifeflow-font-display);
  font-size: 34px;
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
}

    <main>
      <style id="critical-layout">
        /* ============================================================
           LifeFlow 数据洞察 · 趋势分析 — 关键布局静态 CSS（极简克制风）
           主布局不依赖 Tailwind 运行时编译即可渲染；
           一切颜色引用 var(--lifeflow-*)，无硬编码色值。
           规则：单主色石墨黑 / 中性灰三级文字 / 语义状态色仅用于状态
                 / 细线分隔（border-light）/ 圆角 4/8/12 / 禁 emoji
           ============================================================ */

        /* ---- 基础 ---- */
        body {
          font-family: var(--lifeflow-font-body);
          background: var(--lifeflow-background);
          color: var(--lifeflow-text-primary);
          overflow-x: hidden;
        }
        a:focus-visible, button:focus-visible {
          outline: 2px solid var(--lifeflow-ring);
          outline-offset: 2px;
          border-radius: 6px;
        }
        svg[data-lucide], svg.lucide { display: inline-block; flex-shrink: 0; }

        /* ---- 页面容器（文档滚动，底部预留 100px 防导航遮挡） ---- */
        .lf-container {
          max-width: 28rem;
          margin-inline: auto;
          padding: 12px 16px 100px;
        }
        .lf-container > * + * { margin-top: 12px; }

        /* ---- 三级文字色 ---- */
        .lf-text-primary { color: var(--lifeflow-text-primary); }
        .lf-text-secondary { color: var(--lifeflow-text-secondary); }
        .lf-text-tertiary { color: var(--lifeflow-text-tertiary); }

        /* ---- 顶部：返回 + 标题 + 周期分段 ---- */
        .lf-insights-hdr { display: flex; align-items: center; gap: 12px; }
        .lf-back {
          width: 36px; height: 36px; flex: none;
          border-radius: 9999px;
          border: 1px solid var(--lifeflow-border-light);
          background: var(--lifeflow-card);
          color: var(--lifeflow-text-primary);
          display: inline-flex; align-items: center; justify-content: center;
          text-decoration: none;
          transition: transform 0.15s ease, opacity 0.15s ease;
        }
        .lf-back:hover { opacity: 0.85; }
        .lf-back:active { transform: scale(0.92); }
        .lf-back svg[data-lucide] { width: 20px; height: 20px; }
        .lf-page-title {
          flex: 1; min-width: 0; margin: 0;
          font-size: 20px; font-weight: 700; letter-spacing: -0.01em;
          color: var(--lifeflow-text-primary); line-height: 1.25;
        }

        /* ---- 周期分段：周 / 月 chip，选中石墨黑 ---- */
        .lf-seg {
          display: inline-flex; gap: 2px; padding: 2px;
          border: 1px solid var(--lifeflow-border-light);
          border-radius: 9999px;
          background: var(--lifeflow-card);
          flex: none;
        }
        .lf-chip {
          min-width: 40px; height: 26px; padding: 0 12px;
          border: 0; border-radius: 9999px;
          background: transparent;
          color: var(--lifeflow-text-secondary);
          font-size: 13px; font-weight: 500;
          display: inline-flex; align-items: center; justify-content: center;
          cursor: pointer;
          transition: transform 0.15s ease, background-color 0.15s ease, color 0.15s ease;
        }
        .lf-chip:hover { color: var(--lifeflow-text-primary); }
        .lf-chip:active { transform: scale(0.96); }
        .lf-chip.is-active {
          background: var(--lifeflow-primary);
          color: var(--lifeflow-primary-foreground);
          font-weight: 600;
        }

        /* ---- 区块标题 ---- */
        .lf-sect-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
        .lf-sect-title {
          margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -0.01em;
          color: var(--lifeflow-text-primary); line-height: 1.3;
        }
        .lf-hint { font-size: 13px; color: var(--lifeflow-text-tertiary); }

        /* ---- 卡片：白卡 + 1px 细边框 + 12px 圆角，无重阴影 ---- */
        .lf-card {
          background: var(--lifeflow-card);
          border: 1px solid var(--lifeflow-border-light);
          border-radius: var(--lifeflow-radius-lg);
        }
        .lf-trend-card { padding: 16px 16px 14px; }
        .lf-card-hdr { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .lf-card-title {
          margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -0.01em;
          color: var(--lifeflow-text-primary);
        }

        /* ---- 趋势图（SVG 静态折线，石墨黑主色） ---- */
        .lf-chart-box { margin-top: 14px; width: 100%; }
        .lf-chart-box svg { width: 100%; height: auto; display: block; }

        /* ---- 7 天数据标签（tabular-nums 小字） ---- */
        .lf-week-ticks {
          display: grid;
          grid-template-columns: repeat(7, minmax(0, 1fr));
          margin-top: 10px; padding-top: 10px;
          border-top: 1px solid var(--lifeflow-border-light);
        }
        .lf-tick { min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; }
        .lf-tick-day { font-size: 13px; color: var(--lifeflow-text-tertiary); line-height: 1; }
        .lf-tick-val {
          font-family: var(--lifeflow-font-mono);
          font-size: 13px; font-weight: 500;
          color: var(--lifeflow-text-primary);
          font-variant-numeric: tabular-nums;
          line-height: 1;
        }

        /* ---- 维度概览 2×2 细边框格 ---- */
        .lf-dim-grid {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 1px;
          background: var(--lifeflow-border-light);
          border: 1px solid var(--lifeflow-border-light);
          border-radius: var(--lifeflow-radius-lg);
          overflow: hidden;
        }
        .lf-dim-cell { background: var(--lifeflow-card); padding: 14px 16px 15px; min-width: 0; }
        .lf-dim-label { margin: 0; font-size: 13px; color: var(--lifeflow-text-secondary); }
        .lf-dim-stat-row { display: flex; align-items: baseline; gap: 4px; margin-top: 6px; }
        .lf-dim-unit { font-size: 13px; color: var(--lifeflow-text-tertiary); }
        .lf-delta {
          display: inline-flex; align-items: center; gap: 2px;
          margin-top: 8px;
          font-family: var(--lifeflow-font-mono);
          font-size: 13px; font-weight: 600;
          font-variant-numeric: tabular-nums;
          line-height: 1.2;
        }
        .lf-delta i[data-lucide] { width: 12px; height: 12px; }
        .lf-delta.is-up { color: var(--state-success); }
        .lf-delta.is-down { color: var(--state-warning); }

        /* ---- 洞察建议：石墨黑描边圆点 + 细线分隔 ---- */
        .lf-advice-list { margin: 8px 0 0; padding: 0; list-style: none; }
        .lf-advice-item { display: flex; align-items: flex-start; gap: 10px; padding: 13px 0; }
        .lf-advice-item + .lf-advice-item { border-top: 1px solid var(--lifeflow-border-light); }
        .lf-advice-item:first-child { padding-top: 2px; }
        .lf-advice-dot {
          width: 8px; height: 8px; flex: none;
          margin-top: 5px;
          border: 1.5px solid var(--lifeflow-primary);
          border-radius: 9999px;
        }
        .lf-advice-txt {
          margin: 0; min-width: 0; flex: 1;
          font-size: 13px; line-height: 1.6;
          color: var(--lifeflow-text-secondary);
        }
        .lf-advice-txt b {
          color: var(--lifeflow-text-primary);
          font-weight: 600;
          font-family: var(--lifeflow-font-mono);
          font-variant-numeric: tabular-nums;
        }

        /* ---- 底部导航兜底布局（Tailwind 未编译时保证可见） ---- */
        #bottom-nav { height: 60px; max-width: 28rem; margin-inline: auto; width: 100%; }
        #bottom-nav .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); height: 100%; }
        #bottom-nav a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 0; height: 100%; text-decoration: none; }
        #bottom-nav a svg { width: 20px; height: 20px; flex-shrink: 0; }
        #bottom-nav a span { font-size: 10.5px; line-height: 1; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
        #bottom-nav a[data-active="true"] { color: var(--lifeflow-primary); font-weight: 600; }
        #bottom-nav a[data-active="false"] { color: var(--lifeflow-text-tertiary); }

        /* ---- 动效降级 ---- */
        @media (prefers-reduced-motion: reduce) {
          .lf-back, .lf-chip, .lf-delta {
            animation: none !important;
            transition-duration: 0.01ms !important;
          }
        }
      </style>

      <div class="mx-auto max-w-md px-4 pt-3 pb-[100px] lf-container">
        <!-- 1 顶部：返回 + 标题 + 周期分段 -->
        <header class="lf-insights-hdr">
          <a href="#" data-dom-id="back-more" class="lf-back" aria-label="返回">
            <i data-lucide="chevron-left" class="h-5 w-5"></i>
          </a>
          <h1 class="lf-page-title">数据洞察</h1>
          <div class="lf-seg" role="tablist" aria-label="时间粒度">
            <button type="button" data-dom-id="granularity-week" data-granularity="week" role="tab" aria-selected="true" class="lf-chip is-active">周</button>
            <button type="button" data-dom-id="granularity-month" data-granularity="month" role="tab" aria-selected="false" class="lf-chip">月</button>
          </div>
        </header>

        <!-- 2 趋势图卡：专注时长折线图 -->
        <section aria-label="专注时长趋势">

            <div class="lf-card-hdr">
              <h2 class="lf-card-title">专注时长</h2>
              <span class="lf-hint">近 7 天</span>
            </div>
            <div class="lf-chart-box" aria-hidden="true">
              <svg viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg">
                <line x1="32" y1="28" x2="292" y2="28" stroke="var(--lifeflow-border-light)" stroke-width="1"></line>
                <line x1="32" y1="92" x2="292" y2="92" stroke="var(--lifeflow-border-light)" stroke-width="1"></line>
                <line x1="32" y1="156" x2="292" y2="156" stroke="var(--lifeflow-border-light)" stroke-width="1"></line>
                <text x="316" y="37" text-anchor="end" font-size="9" fill="var(--lifeflow-text-tertiary)">3h</text>
                <text x="316" y="101" text-anchor="end" font-size="9" fill="var(--lifeflow-text-tertiary)">1.5h</text>
                <text x="316" y="165" text-anchor="end" font-size="9" fill="var(--lifeflow-text-tertiary)">0h</text>
                <polyline points="36,96 79,84 121,92 164,71 207,88 249,66 292,75" stroke="var(--lifeflow-primary)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"></polyline>
                <circle cx="36" cy="96" r="3" fill="var(--lifeflow-primary)"></circle>
                <circle cx="79" cy="84" r="3" fill="var(--lifeflow-primary)"></circle>
                <circle cx="121" cy="92" r="3" fill="var(--lifeflow-primary)"></circle>
                <circle cx="164" cy="71" r="3" fill="var(--lifeflow-primary)"></circle>
                <circle cx="207" cy="88" r="3" fill="var(--lifeflow-primary)"></circle>
                <circle cx="249" cy="66" r="3" fill="var(--lifeflow-primary)"></circle>
                <circle cx="292" cy="75" r="4" fill="var(--lifeflow-primary)"></circle>
              </svg>
            </div>
            <div class="lf-week-ticks" aria-hidden="true">
              <div class="lf-tick"><span class="lf-tick-day">周一</span><span class="lf-tick-val">1.4h</span></div>
              <div class="lf-tick"><span class="lf-tick-day">周二</span><span class="lf-tick-val">1.7h</span></div>
              <div class="lf-tick"><span class="lf-tick-day">周三</span><span class="lf-tick-val">1.5h</span></div>
              <div class="lf-tick"><span class="lf-tick-day">周四</span><span class="lf-tick-val">2.0h</span></div>
              <div class="lf-tick"><span class="lf-tick-day">周五</span><span class="lf-tick-val">1.6h</span></div>
              <div class="lf-tick"><span class="lf-tick-day">周六</span><span class="lf-tick-val">2.1h</span></div>
              <div class="lf-tick"><span class="lf-tick-day">周日</span><span class="lf-tick-val">1.9h</span></div>
            </div>
          </article>
        </section>

        <!-- 3 维度概览：2×2 细边框格 -->
        <section aria-label="维度概览">
          <div class="lf-sect-h">
            <h2 class="lf-sect-title">维度概览</h2>
            <span class="lf-hint">周环比</span>
          </div>
          <div data-dom-id="dim-grid" class="lf-dim-grid">
            <div class="lf-dim-cell">
              <p class="lf-dim-label">学习时长</p>
              <div class="lf-dim-stat-row">
                <span class="lf-stat lf-text-primary">3.2</span>
                <span class="lf-dim-unit">h</span>
              </div>
              <span class="lf-delta is-up"><i data-lucide="trending-up" class="h-3 w-3"></i>12%</span>
            </div>
            <div class="lf-dim-cell">
              <p class="lf-dim-label">睡眠质量</p>
              <div class="lf-dim-stat-row">
                <span class="lf-stat lf-text-primary">86</span>
                <span class="lf-dim-unit">分</span>
              </div>
              <span class="lf-delta is-down"><i data-lucide="trending-down" class="h-3 w-3"></i>5%</span>
            </div>
            <div class="lf-dim-cell">
              <p class="lf-dim-label">训练次数</p>
              <div class="lf-dim-stat-row">
                <span class="lf-stat lf-text-primary">3</span>
                <span class="lf-dim-unit">次</span>
              </div>
              <span class="lf-delta is-down"><i data-lucide="trending-down" class="h-3 w-3"></i>5%</span>
            </div>
            <div class="lf-dim-cell">
              <p class="lf-dim-label">冥想分钟</p>
              <div class="lf-dim-stat-row">
                <span class="lf-stat lf-text-primary">24</span>
                <span class="lf-dim-unit">分</span>
              </div>
              <span class="lf-delta is-up"><i data-lucide="trending-up" class="h-3 w-3"></i>8%</span>
            </div>
          </div>
        </section>

        <!-- 4 洞察建议 -->
        <section aria-label="洞察建议">
          <div class="lf-sect-h">
            <h2 class="lf-sect-title">洞察建议</h2>
            <span class="lf-hint">自动生成</span>
          </div>
          <ul data-dom-id="advice-list" class="lf-advice-list">
            <li class="lf-advice-item">
              <span class="lf-advice-dot" aria-hidden="true"></span>
              <p class="lf-advice-txt">上午专注效率最高，建议把最重要任务放在 <b>9:00-11:00</b></p>
            </li>
            <li class="lf-advice-item">
              <span class="lf-advice-dot" aria-hidden="true"></span>
              <p class="lf-advice-txt">周三训练缺勤 <b>2</b> 周，建议固定周三为力量日</p>

      <script>
        (function () {
          /* 周期分段：周 / 月 视觉切换 */
          var chips = document.querySelectorAll('.lf-seg [data-granularity]');
          chips.forEach(function (btn) {
            btn.addEventListener('click', function () {
              chips.forEach(function (x) {
                var on = x === btn;
                x.classList.toggle('is-active', on);
                x.setAttribute('aria-selected', on ? 'true' : 'false');
              });
            });
          });
        })();
      </script>
    </main>
