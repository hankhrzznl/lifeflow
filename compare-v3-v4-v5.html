<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>LifeFlow 版本对比 · v3 / v5 合并版</title>
<style>
  body { font-family: -apple-system, "PingFang SC", "Noto Sans SC", sans-serif; background: #0C0F16; color: #EDEAE4; margin: 0; }
  .bar { display: flex; align-items: center; gap: 10px; padding: 14px 20px; background: #141A2E; border-bottom: 1px solid rgba(255,255,255,.08); flex-wrap: wrap; }
  .bar h1 { font-size: 15px; margin: 0 10px 0 0; font-weight: 650; white-space: nowrap; }
  .bar select { background: #1E2745; color: #EDEAE4; border: 1px solid rgba(255,255,255,.14); border-radius: 10px; padding: 8px 12px; font-size: 13px; font-family: inherit; }
  .bar .hint { font-size: 12px; color: #8A8AA0; margin-left: auto; white-space: nowrap; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: rgba(255,255,255,.08); min-height: calc(100vh - 58px); }
  .col { display: flex; flex-direction: column; background: #0D1117; min-width: 0; }
  .col h2 { margin: 0; padding: 10px 14px; font-size: 13px; font-weight: 650; background: #141A2E; border-bottom: 1px solid rgba(255,255,255,.08); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .col h2 .tag { font-size: 10px; padding: 2px 8px; border-radius: 999px; font-weight: 600; }
  .tag-v3 { background: rgba(217,154,43,.18); color: #E0AF52; }
  .tag-v5 { background: rgba(0,47,167,.35); color: #7A9CF8; }
  .note { font-size: 10.5px; color: #8A8AA0; font-weight: 400; }
  iframe { flex: 1; border: 0; width: 100%; background: #FAF6F0; }
  @media (max-width: 800px) { .cols { grid-template-columns: 1fr; } .col { min-height: 70vh; } }
</style>
</head>
<body>
<div class="bar">
  <h1>LifeFlow 版本对比</h1>
  <label style="font-size:12px;color:#8A8AA0;">选择页面</label>
  <select id="pageSel" onchange="reload()"></select>
  <span class="hint">v3 旧版 :8103 · v5 合并版 :8105（v4 已并入 v5）</span>
</div>
<div class="cols">
  <div class="col">
    <h2><span class="tag tag-v3">v3 旧版</span></h2>
    <iframe id="f3" src=""></iframe>
  </div>
  <div class="col">
    <h2><span class="tag tag-v5">v5 合并版</span><span class="note">重做 16 页 + 冻结页 8</span></h2>
    <iframe id="f5" src=""></iframe>
  </div>
</div>
<script>
  // v3 与 v5 合并版可对比的页面映射
  var PAGES = {
    '今天（home）': { v3: 'home-v5.html', v5: 'home-v5.html' },
    '安排（schedule）': { v3: 'schedule.html', v5: 'schedule-v5.html' },
    '方向（direction）': { v3: null, v5: 'direction-v5.html' },
    '我的（profile）': { v3: 'profile.html', v5: 'profile-v5.html' },
    '推进回顾（review）': { v3: 'review.html', v5: 'review-v5.html' },
    '专注（focus）': { v3: 'focus.html', v5: 'focus-v5.html' },
    '情绪（emotion）': { v3: 'mood.html', v5: 'emotion-v5.html' },
    '陪练（coach）': { v3: 'assistant.html', v5: 'coach-v5.html' },
    '新建目标（goal-create）': { v3: 'goal-create.html', v5: 'goal-create-v5.html' },
    '目标详情（goal-detail）': { v3: 'goal-detail.html', v5: 'goal-detail-v5.html' },
    '新用户引导（onboarding）': { v3: 'onboarding.html', v5: 'onboarding-v5.html' },
    '提醒（reminders）': { v3: 'reminders.html', v5: 'reminders-v5.html' },
    '倒数日（countdown）': { v3: 'countdown.html', v5: 'countdown-v5.html' },
    '备忘（notes）': { v3: 'notes.html', v5: 'notes-v5.html' },
    '设置（settings）': { v3: 'settings.html', v5: 'settings-v5.html' },
    '睡眠（sleep · 冻结页）': { v3: 'sleep.html', v5: 'sleep.html' },
    '饮水（water · 冻结页）': { v3: 'water.html', v5: 'water.html' },
    '训练（training · 冻结页）': { v3: 'training.html', v5: 'training.html' },
    '饮食（diet · 冻结页）': { v3: 'diet.html', v5: 'diet.html' },
    '久坐（posture · 冻结页）': { v3: 'posture.html', v5: 'posture.html' },
    '吃药（medication · 冻结页）': { v3: 'medication.html', v5: 'medication.html' },
    '功法养生（wellness · 冻结页）': { v3: 'wellness.html', v5: 'wellness.html' },
    '记账（accounting · 冻结页）': { v3: null, v5: 'accounting.html' }
  };
  var sel = document.getElementById('pageSel');
  Object.keys(PAGES).forEach(function (k) {
    var o = document.createElement('option');
    o.value = k; o.textContent = k;
    sel.appendChild(o);
  });
  function reload() {
    var k = sel.value, p = PAGES[k];
    document.getElementById('f3').src = p.v3 ? 'http://localhost:8103/pages/' + p.v3 : 'about:blank';
    document.getElementById('f5').src = p.v5 ? 'http://localhost:8105/pages/' + p.v5 : 'about:blank';
  }
  reload();
</script>
</body>
</html>
