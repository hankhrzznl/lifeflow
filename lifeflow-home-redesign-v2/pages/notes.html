    <style id="theme-vars">
/* LifeFlow 2.0 — 极简克制设计系统
   第一性原理：目标驱动的个人生活操作系统
   视觉原则：大留白 · 细线分层 · 单主色 · 克制圆角 · 精确排版
   表面模型：静态内容用边框/背景分层，浮动层才允许阴影
   色彩模型：石墨黑主色 + 中性灰阶 + 语义状态色（无模块彩）
*/

/* === LIGHT MODE（日间 · 极简克制） === */
:root {
  /* SURFACE & TEXT */
  --lifeflow-background: #F6F6F7;
  --lifeflow-foreground: #1A1A1E;
  --lifeflow-card: #FFFFFF;
  --lifeflow-card-foreground: #1A1A1E;
  --lifeflow-popover: #FFFFFF;
  --lifeflow-popover-foreground: #1A1A1E;
  --lifeflow-muted: #F0F0F2;
  --lifeflow-muted-foreground: #6E6E76;
  --lifeflow-border: rgba(26,26,30,0.10);
  --lifeflow-border-light: rgba(26,26,30,0.055);
  --lifeflow-border-dashed: rgba(26,26,30,0.16);
  --lifeflow-input: rgba(26,26,30,0.08);
  --lifeflow-ring: #1A1A1E;

  /* BRAND — 单主色（石墨黑，克制使用） */
  --lifeflow-primary: #1A1A1E;
  --lifeflow-primary-hover: #000000;
  --lifeflow-primary-light: rgba(26,26,30,0.06);
  --lifeflow-primary-foreground: #FFFFFF;

  /* PROGRESS */
  --lifeflow-knit-thread: #1A1A1E;
  --lifeflow-knit-thread-completed: #16A34A;
  --lifeflow-knit-thread-partial: #D97706;
  --lifeflow-knit-bg: #EDEDEF;
  --lifeflow-knit-grid: rgba(26,26,30,0.07);

  /* STATE — 语义状态色（仅用于状态，不用于身份标识） */
  --state-success: #16A34A;
  --state-success-light: rgba(22,163,74,0.08);
  --state-warning: #D97706;
  --state-warning-light: rgba(217,119,6,0.08);
  --state-error: #DC2626;
  --state-error-light: rgba(220,38,38,0.08);
  --state-info: #2563EB;
  --state-info-light: rgba(37,99,235,0.08);

  /* TEXT */
  --lifeflow-text-primary: #1A1A1E;
  --lifeflow-text-secondary: #55555E;
  --lifeflow-text-tertiary: #8A8A93;
  --lifeflow-text-disabled: #B8B8BF;
  --lifeflow-text-inverse: #FFFFFF;

  /* SHADOWS — 静态表面走边框，浮动层才用阴影（alpha <= 0.06） */
  --lifeflow-shadow-1: 0 1px 2px rgba(26,26,30,0.04);
  --lifeflow-shadow-2: 0 4px 16px rgba(26,26,30,0.06);
  --lifeflow-shadow-3: 0 12px 32px rgba(26,26,30,0.10);
  --lifeflow-shadow-knit: none;

  /* TAB BAR — 白底细顶线 */
  --lifeflow-tabbar-bg: rgba(255,255,255,0.92);
  --lifeflow-tabbar-blur: 16px;
  --lifeflow-tabbar-blur-saturate: 100%;

  /* AI BALL */
  --lifeflow-ai-ball: #1A1A1E;

  /* TYPOGRAPHY — 精确排版：收紧字距、克制字重 */
  --lifeflow-font-display: -apple-system, BlinkMacSystemFont, "SF Pro SC", "PingFang SC", "Noto Sans SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  --lifeflow-font-body: -apple-system, BlinkMacSystemFont, "SF Pro SC", "PingFang SC", "Noto Sans SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  --lifeflow-font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;

  --lifeflow-font-size-display: 32px;
  --lifeflow-font-size-h1: 26px;
  --lifeflow-font-size-h2: 20px;
  --lifeflow-font-size-h3: 16px;
  --lifeflow-font-size-body: 15px;
  --lifeflow-font-size-sm: 13px;
  --lifeflow-font-size-caption: 12px;

  /* SPACING */
  --lifeflow-space-xs: 4px;
  --lifeflow-space-sm: 8px;
  --lifeflow-space-md: 12px;
  --lifeflow-space-lg: 16px;
  --lifeflow-space-xl: 24px;
  --lifeflow-space-2xl: 32px;

  /* RADIUS — 克制圆角：sm 4 / md 8 / lg 12 / full */
  --lifeflow-radius-sm: 4px;
  --lifeflow-radius-md: 8px;
  --lifeflow-radius-lg: 12px;
  --lifeflow-radius-xl: 12px;
  --lifeflow-radius-full: 9999px;

  /* PORTABLE ALIASES */
  --background: var(--lifeflow-background);
  --foreground: var(--lifeflow-foreground);
  --card: var(--lifeflow-card);
  --card-foreground: var(--lifeflow-card-foreground);
  --popover: var(--lifeflow-popover);
  --popover-foreground: var(--lifeflow-popover-foreground);
  --primary: var(--lifeflow-primary);
  --primary-foreground: var(--lifeflow-primary-foreground);
  --muted: var(--lifeflow-muted);
  --muted-foreground: var(--lifeflow-muted-foreground);
  --border: var(--lifeflow-border);
  --input: var(--lifeflow-input);
  --ring: var(--lifeflow-ring);
  --radius-sm: var(--lifeflow-radius-sm);
  --radius-md: var(--lifeflow-radius-md);
  --radius-lg: var(--lifeflow-radius-lg);
  --color-background: var(--lifeflow-background);
  --color-foreground: var(--lifeflow-foreground);
  --color-card: var(--lifeflow-card);
  --color-card-foreground: var(--lifeflow-card-foreground);
  --color-popover: var(--lifeflow-popover);
  --color-popover-foreground: var(--lifeflow-popover-foreground);
  --color-primary: var(--lifeflow-primary);
  --color-primary-foreground: var(--lifeflow-primary-foreground);
  --color-muted: var(--lifeflow-muted);
  --color-muted-foreground: var(--lifeflow-muted-foreground);
  --color-border: var(--lifeflow-border);
  --color-input: var(--lifeflow-input);
  --color-ring: var(--lifeflow-ring);
  --color-text-primary: var(--lifeflow-text-primary);
  --color-text-secondary: var(--lifeflow-text-secondary);
  --color-text-tertiary: var(--lifeflow-text-tertiary);
  --color-text-disabled: var(--lifeflow-text-disabled);
  --color-surface-card: var(--lifeflow-card);
  --color-surface-muted: var(--lifeflow-muted);
}

/* === DARK MODE（夜间 · 深空石墨） === */
.dark {
  --lifeflow-background: #0E0E11;
  --lifeflow-foreground: #F2F2F4;
  --lifeflow-card: #16161A;
  --lifeflow-card-foreground: #F2F2F4;
  --lifeflow-popover: #1C1C21;
  --lifeflow-popover-foreground: #F2F2F4;
  --lifeflow-muted: #1E1E23;
  --lifeflow-muted-foreground: rgba(242,242,244,0.55);
  --lifeflow-border: rgba(255,255,255,0.10);
  --lifeflow-border-light: rgba(255,255,255,0.06);
  --lifeflow-border-dashed: rgba(255,255,255,0.18);
  --lifeflow-input: rgba(255,255,255,0.10);
  --lifeflow-ring: #F2F2F4;

  --lifeflow-primary: #F2F2F4;
  --lifeflow-primary-hover: #FFFFFF;
  --lifeflow-primary-light: rgba(255,255,255,0.09);
  --lifeflow-primary-foreground: #0E0E11;

  --lifeflow-knit-thread: #F2F2F4;
  --lifeflow-knit-thread-completed: #34D399;
  --lifeflow-knit-thread-partial: #FBBF24;
  --lifeflow-knit-bg: rgba(255,255,255,0.10);
  --lifeflow-knit-grid: rgba(255,255,255,0.07);

  --state-success: #34D399;
  --state-success-light: rgba(52,211,153,0.12);
  --state-warning: #FBBF24;
  --state-warning-light: rgba(251,191,36,0.12);
  --state-error: #F87171;
  --state-error-light: rgba(248,113,113,0.12);
  --state-info: #60A5FA;
  --state-info-light: rgba(96,165,250,0.12);

  --lifeflow-text-primary: #F2F2F4;
  --lifeflow-text-secondary: rgba(242,242,244,0.68);
  --lifeflow-text-tertiary: rgba(242,242,244,0.42);
  --lifeflow-text-disabled: rgba(242,242,244,0.28);
  --lifeflow-text-inverse: #0E0E11;

  --lifeflow-shadow-1: 0 1px 2px rgba(0,0,0,0.30);
  --lifeflow-shadow-2: 0 4px 16px rgba(0,0,0,0.40);
  --lifeflow-shadow-3: 0 12px 32px rgba(0,0,0,0.55);
  --lifeflow-shadow-knit: none;

  --lifeflow-tabbar-bg: rgba(14,14,17,0.88);
  --lifeflow-tabbar-blur: 16px;
  --lifeflow-tabbar-blur-saturate: 100%;

  --lifeflow-ai-ball: #F2F2F4;
}

/* === TYPOGRAPHY UTILITY CLASSES === */
.lf-display {
  font-family: var(--lifeflow-font-display);
  font-size: var(--lifeflow-font-size-display);
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.2;
}

.lf-h1 {
  font-family: var(--lifeflow-font-display);
  font-size: var(--lifeflow-font-size-h1);
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.25;
}

.lf-h2 {
  font-family: var(--lifeflow-font-display);
  font-size: var(--lifeflow-font-size-h2);
  font-weight: 600;
  letter-spacing: -0.015em;
  line-height: 1.3;
}

.lf-h3 {
  font-family: var(--lifeflow-font-body);
  font-size: var(--lifeflow-font-size-h3);
  font-weight: 600;
  letter-spacing: -0.01em;
  line-height: 1.4;
}

.lf-body {
  font-family: var(--lifeflow-font-body);
  font-size: var(--lifeflow-font-size-body);
  font-weight: 400;
  line-height: 1.55;
}

.lf-body-sm {
  font-family: var(--lifeflow-font-body);
  font-size: var(--lifeflow-font-size-sm);
  font-weight: 400;
  line-height: 1.5;
}

.lf-caption {
  font-family: var(--lifeflow-font-body);
  font-size: var(--lifeflow-font-size-caption);
  font-weight: 400;
  line-height: 1.5;
}

.lf-mono {
  font-family: var(--lifeflow-font-mono);
  font-size: var(--lifeflow-font-size-sm);
  font-weight: 400;
  line-height: 1.6;
}

/* === PROGRESS BAR（细胶囊） === */
.knit-track {
  position: relative;
  height: 5px;
  border-radius: var(--lifeflow-radius-full);
  overflow: hidden;
  background: var(--lifeflow-knit-bg);
}

.knit-fill {
  position: absolute;
  left: 0;
  top: 0;
  height: 100%;
  border-radius: var(--lifeflow-radius-full);
  background: var(--lifeflow-knit-thread);
  z-index: 2;
  transition: width 0.5s ease-in-out;
}

.knit-fill--done { background: var(--lifeflow-knit-thread-completed); }
.knit-fill--partial { background: var(--lifeflow-knit-thread-partial); }

.knit-yarn { display: none; }

.knit-percent {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  z-index: 4;
  font-family: var(--lifeflow-font-body);
  font-size: var(--lifeflow-font-size-sm);
  font-weight: 600;
  color: var(--lifeflow-text-primary);
  line-height: 1;
}

/* === TAB BAR（白底细顶线，跟随模式） === */
.lf-tabbar-glass {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 40;
  border-top: 1px solid var(--lifeflow-border);
  background: var(--lifeflow-tabbar-bg);
  -webkit-backdrop-filter: saturate(var(--lifeflow-tabbar-blur-saturate)) blur(var(--lifeflow-tabbar-blur));
  backdrop-filter: saturate(var(--lifeflow-tabbar-blur-saturate)) blur(var(--lifeflow-tabbar-blur));
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

/* === 极简通用组件 === */
/* 细线分隔列表（克制分割线） */
.lf-list-divider > * + * {
  border-top: 1px solid var(--lifeflow-border-light);
}

/* 卡片：静态内容用 1px 细边框 + 极淡阴影，不靠重阴影 */
.lf-surface {
  background: var(--lifeflow-card);
  border: 1px solid var(--lifeflow-border-light);
  border-radius: var(--lifeflow-radius-lg);
}

/* 数字对齐（时间/金额/进度） */
.lf-tabular {
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum";
}

/* 大数字（统计强调） */
.lf-stat {
  font-family: var(--lifeflow-font-display);
  font-size: 34px;
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
}

    <main>
      <style id="critical-layout">
        /* ============================================================
           LifeFlow 备忘 · 极简克制 — 关键布局静态 CSS
           不依赖 Tailwind 运行时即可渲染完整骨架；
           颜色全部引用 var(--lifeflow-*)，无硬编码色值。
           视口模式：document-scroll（文档整体滚动，无内嵌滚动容器）。
           ============================================================ */
        body {
          font-family: var(--lifeflow-font-body);
          background: var(--lifeflow-background);
          color: var(--lifeflow-text-primary);
          overflow-x: hidden;
        }
        a:focus-visible, button:focus-visible, input:focus-visible {
          outline: 2px solid var(--lifeflow-ring);
          outline-offset: 2px;
          border-radius: var(--lifeflow-radius-md);
        }
        svg[data-lucide] { display: inline-block; flex-shrink: 0; }
        i[data-lucide] { font-style: normal; }

        /* ---- 内容区容器（max-w-md mx-auto + 文档滚动，底部预留 100px） ---- */
        .lf-notes-wrap {
          max-width: 28rem;      /* max-w-md = 448px */
          margin-inline: auto;
          padding: 0.75rem 1rem 6.25rem;   /* pt-3 px-4 pb-[100px] */
        }
        .lf-notes-wrap > * + * { margin-top: 0.75rem; }

        /* ---- 顶部导航：返回 + 标题（40 / 1fr / 40 三栏对齐） ---- */
        .lf-notes-hdr {
          display: grid;
          grid-template-columns: 40px minmax(0, 1fr) 40px;
          align-items: center;
          padding: 4px 0;
        }
        .lf-notes-back {
          width: 40px; height: 40px;
          border-radius: var(--lifeflow-radius-md);
          display: inline-flex; align-items: center; justify-content: center;
          background: transparent;
          color: var(--lifeflow-text-primary);
          text-decoration: none;
          transition: background 0.15s ease, transform 0.15s ease;
        }
        .lf-notes-back:hover { background: var(--lifeflow-primary-light); }
        .lf-notes-back:active { transform: scale(0.92); }
        .lf-notes-back svg[data-lucide] { width: 22px; height: 22px; }
        .lf-notes-title {
          margin: 0; text-align: center;
          font-size: 17px; font-weight: 600; letter-spacing: -0.01em;
          line-height: 1.25; color: var(--lifeflow-text-primary);
        }
        .lf-notes-spacer { width: 40px; height: 40px; }

        /* ---- 搜索行：放大镜 + 细边框输入 ---- */
        .lf-search-box {
          display: flex; align-items: center; gap: 8px;
          background: var(--lifeflow-card);
          border: 1px solid var(--lifeflow-border-light);
          border-radius: var(--lifeflow-radius-md);
          padding: 0 12px;
          transition: border-color 0.15s ease;
        }
        .lf-search-box:focus-within { border-color: var(--lifeflow-border); }
        .lf-search-box svg[data-lucide] { width: 16px; height: 16px; color: var(--lifeflow-text-tertiary); flex: none; }
        .lf-search-input {
          flex: 1; min-width: 0;
          background: transparent; border: 0; outline: none;
          font-size: 15px; color: var(--lifeflow-text-primary);
          padding: 10px 0; height: auto;
        }
        .lf-search-input::placeholder { color: var(--lifeflow-text-tertiary); }

        /* ---- 置顶 / 归档 开关：细边框 chip ---- */
        .lf-chips { display: flex; gap: 8px; }
        .lf-chip {
          flex: none;
          display: inline-flex; align-items: center; justify-content: center;
          border-radius: var(--lifeflow-radius-md);
          padding: 6px 14px;
          font-size: 13px; font-weight: 600;
          background: var(--lifeflow-card);
          color: var(--lifeflow-text-secondary);
          border: 1px solid var(--lifeflow-border-light);
          transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
        }
        .lf-chip:hover { color: var(--lifeflow-text-primary); }
        .lf-chip:active { transform: scale(0.96); }
        .lf-chip.is-active {
          background: var(--lifeflow-primary);
          border-color: var(--lifeflow-primary);
          color: var(--lifeflow-text-inverse);
        }
        .lf-chip.is-active:hover { color: var(--lifeflow-text-inverse); }

        /* ---- 笔记列表卡：白底 + 1px 细边框 + 细线分隔 ---- */
        .lf-notes-card {
          background: var(--lifeflow-card);
          border: 1px solid var(--lifeflow-border-light);
          border-radius: var(--lifeflow-radius-lg);
          overflow: hidden;
        }
        .lf-note {
          display: block; width: 100%; text-align: left;
          background: transparent; border: 0;
          border-top: 1px solid var(--lifeflow-border-light);
          padding: 14px 16px;
          cursor: pointer;
          transition: background 0.15s ease;
        }
        .lf-note:first-child { border-top: 0; }
        .lf-note:hover { background: var(--lifeflow-muted); }
        .lf-note:active { background: var(--lifeflow-muted); }
        .lf-note-main { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
        .lf-note-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; min-width: 0; }
        .lf-note-title {
          font-size: 15px; font-weight: 600; color: var(--lifeflow-text-primary);
          line-height: 1.35;
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .lf-note-date {
          flex: none;
          font-family: var(--lifeflow-font-mono);
          font-size: 12px; color: var(--lifeflow-text-tertiary);
          font-variant-numeric: tabular-nums;
          white-space: nowrap;
        }
        .lf-note-preview {
          font-size: 13px; color: var(--lifeflow-text-tertiary);
          line-height: 1.4;
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .lf-note.is-hidden { display: none; }

        /* ---- 空态 ---- */
        .lf-notes-empty {
          display: none;
          flex-direction: column; align-items: center; gap: 6px;
          padding: 36px 16px; text-align: center;
        }
        .lf-notes-empty.lf-show { display: flex; }
        .lf-notes-empty p { margin: 0; font-size: 13px; color: var(--lifeflow-text-tertiary); }

        /* ---- 底部主按钮：固定于导航上方，石墨黑填充白字圆角 8 ---- */
        .lf-add-bar {
          position: fixed; left: 50%; transform: translateX(-50%);
          bottom: calc(60px + env(safe-area-inset-bottom, 0px) + 12px);
          z-index: 40;
          width: 100%; max-width: 28rem;
          padding: 0 1rem;
        }
        .lf-btn-add {
          display: flex; align-items: center; justify-content: center; gap: 6px;
          width: 100%; height: 48px;
          border: 0; border-radius: var(--lifeflow-radius-md);
          background: var(--lifeflow-primary);
          color: var(--lifeflow-text-inverse);
          font-size: 15px; font-weight: 600; letter-spacing: 0.01em;
          cursor: pointer;
          transition: opacity 0.15s ease, transform 0.15s ease;
        }
        .lf-btn-add:hover { opacity: 0.92; }
        .lf-btn-add:active { transform: scale(0.98); }
        .lf-btn-add svg[data-lucide] { width: 18px; height: 18px; }

        /* ---- 底部导航兜底布局（Tailwind 未编译时保证可见） ---- */
        #bottom-nav { height: 60px; max-width: 28rem; margin-inline: auto; width: 100%; }
        #bottom-nav .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); height: 100%; }
        #bottom-nav a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 0; height: 100%; text-decoration: none; }
        #bottom-nav a svg { width: 20px; height: 20px; flex-shrink: 0; }
        #bottom-nav a span { font-size: 10.5px; line-height: 1; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
        #bottom-nav a[data-active="true"] { color: var(--lifeflow-primary); font-weight: 600; }
        #bottom-nav a[data-active="false"] { color: var(--lifeflow-text-tertiary); }

        /* ---- 无障碍动效降级 ---- */
        @media (prefers-reduced-motion: reduce) {
          .lf-notes-back, .lf-chip, .lf-btn-add, .lf-note {
            transition-duration: 0.01ms !important;
          }
        }
      </style>

      <div class="lf-notes-wrap mx-auto max-w-md px-4 pt-3 pb-[100px]">
        <!-- 1 顶部：返回 + 标题「备忘」 -->
        <header class="lf-notes-hdr">
          <a href="#" data-dom-id="back-more" aria-label="返回" class="lf-notes-back"><i data-lucide="chevron-left" class="w-5 h-5"></i></a>
          <h1 class="lf-notes-title">备忘</h1>
          <span class="lf-notes-spacer" aria-hidden="true"></span>
        </header>

        <!-- 2 搜索行 -->
        <div data-dom-id="notes-search" class="lf-search-box">
          <i data-lucide="search" class="w-4 h-4"></i>
          <input type="search" data-dom-id="search-input" class="lf-search-input" placeholder="搜索备忘" autocomplete="off" aria-label="搜索备忘">
        </div>

        <!-- 3 置顶 / 归档 开关 -->
        <div data-dom-id="notes-pin" class="lf-chips" role="group" aria-label="筛选备忘">
          <button type="button" data-dom-id="chip-pinned" data-filter="pinned" class="lf-chip" aria-pressed="false">置顶</button>
          <button type="button" data-dom-id="chip-archive" data-filter="archive" class="lf-chip" aria-pressed="false">归档</button>
        </div>

        <!-- 4 笔记列表（细线分隔） -->
        <section data-dom-id="notes-list" class="lf-notes-card" aria-label="笔记列表">
          <button type="button" data-dom-id="note-1" data-note-id="n1" data-pinned="true" data-archived="false" class="lf-note" aria-label="查看备忘：行测公式整理">
            <span class="lf-note-main">
              <span class="lf-note-top">
                <span class="lf-note-title">行测公式整理</span>
                <time class="lf-note-date">8月10日 21:40</time>
              </span>
              <span class="lf-note-preview">增长率 = (现期-基期)/基期…</span>
            </span>
          </button>
          <button type="button" data-dom-id="note-2" data-note-id="n2" data-pinned="false" data-archived="false" class="lf-note" aria-label="查看备忘：四级作文模板">
            <span class="lf-note-main">
              <span class="lf-note-top">
                <span class="lf-note-title">四级作文模板</span>
                <time class="lf-note-date">8月10日 08:15</time>
              </span>
              <span class="lf-note-preview">开头段三句式…</span>
            </span>
          </button>
          <button type="button" data-dom-id="note-3" data-note-id="n3" data-pinned="false" data-archived="false" class="lf-note" aria-label="查看备忘：购物清单">
            <span class="lf-note-main">
              <span class="lf-note-top">
                <span class="lf-note-title">购物清单</span>
                <time class="lf-note-date">8月9日 19:02</time>
              </span>
              <span class="lf-note-preview">洗衣液、抽纸…</span>
            </span>
          </button>
        </section>

        <!-- 空态 -->
        <div data-dom-id="notes-empty" class="lf-notes-empty" role="status">
          <p>没有匹配的备忘</p>
        </div>
      </div>

      <!-- 5 底部主按钮：新建备忘 -->
      <div class="lf-add-bar">
        <button type="button" data-dom-id="notes-add" class="lf-btn-add"><i data-lucide="plus" class="w-[18px] h-[18px]"></i>新建备忘</button>
      </div>

      <!-- 底部导航 4-tab（data-nav-key=home 激活） -->
      <nav data-mobile-nav="global" id="bottom-nav" class="lf-tabbar-glass w-full max-w-md mx-auto h-[60px]"><div class="grid grid-cols-4 h-full"><a href="#" data-dom-id="nav-home" data-nav-key="home" data-active="true" class="min-w-0 flex flex-col items-center justify-center gap-1 h-full text-[var(--lifeflow-primary)]"><i data-lucide="home" class="w-5 h-5 shrink-0"></i><span class="text-[10.5px] leading-none whitespace-nowrap max-w-full truncate font-semibold">首页</span></a><a href="#" data-dom-id="nav-goals" data-nav-key="goals" data-active="false" class="min-w-0 flex flex-col items-center justify-center gap-1 h-full text-[var(--lifeflow-text-tertiary)]"><i data-lucide="target" class="w-5 h-5 shrink-0"></i><span class="text-[10.5px] leading-none whitespace-nowrap max-w-full truncate">目标</span></a><a href="#" data-dom-id="nav-schedule" data-nav-key="schedule" data-active="false" class="min-w-0 flex flex-col items-center justify-center gap-1 h-full text-[var(--lifeflow-text-tertiary)]"><i data-lucide="calendar-days" class="w-5 h-5 shrink-0"></i><span class="text-[10.5px] leading-none whitespace-nowrap max-w-full truncate">日程</span></a><a href="#" data-dom-id="nav-ideal" data-nav-key="ideal" data-active="false" class="min-w-0 flex flex-col items-center justify-center gap-1 h-full text-[var(--lifeflow-text-tertiary)]"><i data-lucide="sun" class="w-5 h-5 shrink-0"></i><span class="text-[10.5px] leading-none whitespace-nowrap max-w-full truncate">理想日</span></a></div></nav>

      <script>
      (function () {
        'use strict';
        var list = document.querySelector('[data-dom-id="notes-list"]');
        var empty = document.querySelector('[data-dom-id="notes-empty"]');
        var searchInput = document.querySelector('[data-dom-id="search-input"]');
        var chips = Array.prototype.slice.call(document.querySelectorAll('[data-dom-id="notes-pin"] .lf-chip'));
        var activeFilter = null;

        function applyFilters() {
          var q = (searchInput ? searchInput.value : '').trim().toLowerCase();
          var visible = 0;
          Array.prototype.forEach.call(list.querySelectorAll('.lf-note'), function (row) {
            var pinned = row.getAttribute('data-pinned') === 'true';
            var archived = row.getAttribute('data-archived') === 'true';
            var matches = true;
            if (activeFilter === 'pinned') matches = pinned;
            else if (activeFilter === 'archive') matches = archived;
            if (matches && q) {
              var hay = (row.querySelector('.lf-note-title') ? row.querySelector('.lf-note-title').textContent : '') +
                        ' ' + (row.querySelector('.lf-note-preview') ? row.querySelector('.lf-note-preview').textContent : '');
              matches = hay.toLowerCase().indexOf(q) !== -1;
            }
            row.classList.toggle('is-hidden', !matches);
            if (matches) visible += 1;
          });
          if (empty) empty.classList.toggle('lf-show', visible === 0);
        }

        function selectFilter(key) {
          activeFilter = (activeFilter === key) ? null : key;
          chips.forEach(function (chip) {
            var on = chip.getAttribute('data-filter') === activeFilter;
            chip.classList.toggle('is-active', on);
            chip.setAttribute('aria-pressed', String(on));
          });
          applyFilters();
        }

        chips.forEach(function (chip) {
          chip.addEventListener('click', function () {
            selectFilter(chip.getAttribute('data-filter'));
          });
        });
        if (searchInput) searchInput.addEventListener('input', applyFilters);
      })();
      </script>
    </main>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
