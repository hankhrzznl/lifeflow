<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="LifeFlow">
  <!-- 暖米底 -->
  <rect width="100" height="100" fill="#FAF6F0"/>
  <!-- Klein 蓝方块（品牌色口径 #002FA7） -->
  <rect x="16" y="16" width="68" height="68" rx="22" fill="#002FA7"/>
  <!-- 三个点 = 三种姿态：此刻 / 刚过去 / 往后 -->
  <circle cx="31" cy="50" r="7.5" fill="#FFFFFF"/>
  <circle cx="50" cy="50" r="7.5" fill="#FFFFFF"/>
  <circle cx="69" cy="50" r="7.5" fill="#FFFFFF"/>
</svg>
