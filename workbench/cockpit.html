<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F5F0">
<title>执灯人 · 作战台</title>
<!-- 本工作台通过 WorkBuddy「资料库」skill 搭建与部署；勾选状态存于浏览器本地 -->
<style>
:root{
  --paper:#F7F5F0;
  --card:#FFFFFF;
  --card2:#FBFAF6;
  --ink:#1A1917;
  --ink2:#56524A;
  --ink3:#8D887E;
  --ink4:#B7B2A6;
  --line:#E6E1D6;
  --line2:#F1EDE4;
  --cinnabar:#B8433A;
  --cinnabar-bg:#FBEDEB;
  --qing:#2F6068;
  --qing-bg:#EAF2F2;
  --amber:#A8813F;
  --amber-bg:#FBF3E4;
  --jade:#4B7A5A;
  --jade-bg:#EDF4EE;
  --slate:#5C6B7A;
  --slate-bg:#EDF1F5;
  --radius:14px;
  --shadow:0 1px 2px rgba(26,25,23,.05), 0 10px 30px -22px rgba(26,25,23,.35);
  --serif:"Songti SC","Source Han Serif SC","Noto Serif CJK SC",STSong,SimSun,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans);
  background:
    radial-gradient(900px 520px at 12% -8%, rgba(47,96,104,.055), transparent 62%),
    radial-gradient(760px 460px at 96% 4%, rgba(168,129,63,.07), transparent 60%),
    var(--paper);
  color:var(--ink);
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;font-size:inherit}
a{color:inherit;text-decoration:none}
input{font-family:inherit}
.i{display:block;flex:none}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:238px minmax(0,1fr);min-height:100vh}
.side{
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;
  padding:26px 18px 18px;border-right:1px solid var(--line);
  background:linear-gradient(180deg,rgba(255,255,255,.62),rgba(255,255,255,.2));
  backdrop-filter:blur(6px);z-index:30;
}
.brand{display:flex;align-items:center;gap:11px;padding:0 6px 22px}
.brand-lamp{width:38px;height:38px;flex:none}
.brand-name{font-family:var(--serif);font-size:17px;letter-spacing:.02em;font-weight:600;line-height:1.2;white-space:nowrap}
.brand-sub{font-size:11px;color:var(--ink3);letter-spacing:.16em;margin-top:3px}

.nav{display:flex;flex-direction:column;gap:4px}
.nav-item{
  display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border-radius:10px;
  color:var(--ink2);font-size:14.5px;transition:background .16s ease,color .16s ease;text-align:left;width:100%;
}
.nav-item:hover{background:rgba(26,25,23,.045)}
.nav-item.on{background:var(--ink);color:#F7F5F0}
.nav-item.on .nav-count{background:rgba(255,255,255,.16);color:#F7F5F0}
.nav-count{margin-left:auto;font-size:11.5px;background:rgba(26,25,23,.06);color:var(--ink3);padding:1px 7px;border-radius:99px;font-variant-numeric:tabular-nums}
.nav-count.warn{background:var(--cinnabar-bg);color:var(--cinnabar)}

.side-foot{margin-top:auto;padding-top:18px;border-top:1px solid var(--line2);display:flex;flex-direction:column;gap:10px}
.save{
  display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink3);
  padding:0 6px;
}
.dot{width:6px;height:6px;border-radius:50%;background:var(--jade);box-shadow:0 0 0 3px rgba(75,122,90,.12);flex:none}
.side-actions{display:flex;gap:6px}
.sbtn{
  flex:1;display:flex;align-items:center;justify-content:center;gap:5px;
  min-height:36px;border:1px solid var(--line);border-radius:9px;background:#fff;
  font-size:12px;color:var(--ink2);transition:border-color .16s,color .16s;
}
.sbtn:hover{border-color:var(--ink4);color:var(--ink)}
.ver{font-size:10.5px;color:var(--ink4);padding:0 6px;letter-spacing:.04em}

.main{min-width:0;padding:0 34px 70px}
.topbar{
  display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;
  padding:30px 0 20px;position:sticky;top:0;z-index:20;
  background:linear-gradient(180deg,var(--paper) 62%,rgba(247,245,240,.86) 88%,rgba(247,245,240,0));
  backdrop-filter:blur(3px);
}
.view-title{font-family:var(--serif);font-size:27px;font-weight:600;letter-spacing:.03em;margin:0;line-height:1.15}
.view-sub{margin:5px 0 0;font-size:12.5px;color:var(--ink3);letter-spacing:.02em}
.topbar-right{display:flex;align-items:center;gap:10px}
.search{
  display:flex;align-items:center;gap:7px;height:38px;padding:0 12px;
  border:1px solid var(--line);border-radius:99px;background:#fff;color:var(--ink3);
  transition:border-color .16s;
}
.search:focus-within{border-color:var(--ink3)}
.search input{border:0;outline:0;background:none;font-size:16px;width:132px;color:var(--ink)}
.search input::placeholder{color:var(--ink4)}
.date-chip{
  display:flex;align-items:center;gap:6px;height:38px;padding:0 13px;border:1px solid var(--line);
  border-radius:99px;background:#fff;font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums;
}
.gone{display:none!important}

.view{animation:rise .34s cubic-bezier(.22,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view{animation:none}*{transition:none!important}}

/* ---------- generic ---------- */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.sec{margin-bottom:26px}
.sec-head{display:flex;align-items:baseline;gap:10px;margin:0 0 12px}
.sec-head h2{
  font-family:var(--serif);font-size:16px;font-weight:600;margin:0;letter-spacing:.05em;
  display:flex;align-items:center;gap:8px;
}
.sec-head h2::before{content:"";width:3px;height:14px;border-radius:2px;background:var(--cinnabar);opacity:.85}
.sec-head .hint{font-size:11.5px;color:var(--ink3);margin-left:auto;letter-spacing:.02em}
.chip{
  display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px;border-radius:6px;
  font-size:11px;letter-spacing:.02em;font-weight:500;white-space:nowrap;
}
.chip.p0{background:var(--cinnabar-bg);color:var(--cinnabar)}
.chip.p1{background:var(--amber-bg);color:var(--amber)}
.chip.p2{background:var(--slate-bg);color:var(--slate)}
.chip.keep{background:var(--jade-bg);color:var(--jade)}
.chip.cut{background:#F2F0EA;color:var(--ink3);text-decoration:line-through}
.chip.new{background:var(--qing-bg);color:var(--qing)}
.chip.warn{background:var(--cinnabar-bg);color:var(--cinnabar)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px}

/* ---------- today hero ---------- */
.hero{
  display:grid;grid-template-columns:minmax(0,1fr) 168px;gap:22px;align-items:center;
  padding:24px 26px;margin-bottom:18px;overflow:hidden;position:relative;
  background:linear-gradient(135deg,#FFFDF8 0%,#FFFFFF 46%,#F6F8F7 100%);
}
.hero::after{
  content:"";position:absolute;right:-70px;top:-90px;width:300px;height:300px;border-radius:50%;
  background:radial-gradient(circle,rgba(184,67,58,.07),transparent 66%);pointer-events:none;
}
.hero-eyebrow{font-size:11.5px;letter-spacing:.2em;color:var(--ink3);margin-bottom:9px}
.hero-quote{
  font-family:var(--serif);font-size:22px;line-height:1.5;margin:0 0 8px;letter-spacing:.03em;color:var(--ink);
}
.hero-quote em{font-style:normal;color:var(--cinnabar)}
.hero-note{font-size:12.5px;color:var(--ink3);margin:0;max-width:52ch}
.hero-stats{display:flex;gap:24px;margin-top:18px;flex-wrap:wrap}
.hstat b{display:block;font-family:var(--serif);font-size:26px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.hstat span{font-size:11.5px;color:var(--ink3);letter-spacing:.03em}
.hero-lamp{display:flex;justify-content:center;align-items:center}
.lamp-fig{width:150px;height:180px}

/* ---------- task list ---------- */
.task-list{display:flex;flex-direction:column}
.task{
  display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:13px;align-items:start;
  padding:15px 20px;border-top:1px solid var(--line2);transition:background .14s;
}
.task:first-child{border-top:0}
.task:hover{background:var(--card2)}
.task.overdue{background:linear-gradient(90deg,rgba(184,67,58,.055),transparent 34%)}
.tbox{
  width:22px;height:22px;border-radius:7px;border:1.5px solid #D8D2C4;background:#fff;
  display:flex;align-items:center;justify-content:center;margin-top:1px;color:transparent;
  transition:all .16s ease;flex:none;
}
.task:hover .tbox{border-color:var(--ink3)}
.tbox.on{background:var(--ink);border-color:var(--ink);color:#F7F5F0}
.task-body{min-width:0}
.task-title{font-size:14.5px;line-height:1.5;word-break:break-word}
.task.done .task-title{color:var(--ink4);text-decoration:line-through}
.task-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:7px;font-size:11.5px;color:var(--ink3)}
.task-meta .sep{width:1px;height:9px;background:var(--line)}
.due{font-variant-numeric:tabular-nums}
.due.red{color:var(--cinnabar);font-weight:600}
.task-right{display:flex;align-items:center;gap:8px;padding-top:2px}
.tag-src{font-size:11px;color:var(--ink3);background:var(--card2);border:1px solid var(--line2);padding:2px 8px;border-radius:6px;white-space:nowrap}

/* ---------- snapshot / metrics ---------- */
.snap{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.metric{padding:17px 18px 15px}
.metric .k{font-size:11.5px;color:var(--ink3);letter-spacing:.05em;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.metric .v{font-family:var(--serif);font-size:29px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.metric .v small{font-size:12px;font-family:var(--sans);color:var(--ink3);font-weight:400;margin-left:3px;letter-spacing:0}
.metric .d{font-size:11px;color:var(--ink3);margin-top:7px}
.bar{height:4px;border-radius:99px;background:#EFEBE2;overflow:hidden;margin-top:11px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--ink);transition:width .5s cubic-bezier(.22,.7,.3,1)}
.bar i.jade{background:var(--jade)}
.bar i.qing{background:var(--qing)}
.bar i.amber{background:var(--amber)}

/* pivot banner */
.pivot{
  display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;
  padding:18px 22px;border-radius:var(--radius);border:1px solid #DDD6C6;
  background:linear-gradient(100deg,#FFFBF4,#FBF6EC);margin-bottom:26px;
}
.pivot-badge{
  font-family:var(--serif);font-size:12px;letter-spacing:.1em;color:var(--cinnabar);
  border:1px solid rgba(184,67,58,.3);background:#fff;border-radius:8px;padding:7px 10px;white-space:nowrap;
}
.pivot-t{font-size:14px;margin:0 0 3px;line-height:1.5}
.pivot-s{font-size:12px;color:var(--ink3);margin:0;line-height:1.55}
.pivot-go{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink2);border-bottom:1px solid var(--ink4);padding-bottom:1px;white-space:nowrap}

/* ---------- progress ---------- */
.ms-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.ms{padding:16px 17px;position:relative;overflow:hidden}
.ms-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}
.ms-id{font-family:var(--serif);font-size:15px;font-weight:600;letter-spacing:.04em}
.ms-st{font-size:10.5px;letter-spacing:.06em;padding:2px 7px;border-radius:5px;white-space:nowrap}
.ms-st.ok{background:var(--jade-bg);color:var(--jade)}
.ms-st.todo{background:var(--amber-bg);color:var(--amber)}
.ms-name{font-size:13px;margin:0 0 4px}
.ms-d{font-size:11.5px;color:var(--ink3);line-height:1.5;margin:0}

.epics{display:flex;flex-direction:column;gap:9px}
.epic{
  display:grid;grid-template-columns:132px minmax(0,1fr) 76px;gap:14px;align-items:center;
  padding:13px 18px;border:1px solid var(--line);border-radius:11px;background:#fff;
}
.epic-name{font-size:13px;display:flex;align-items:center;gap:8px}
.epic-id{font-family:var(--serif);font-size:11.5px;color:var(--ink3);letter-spacing:.06em}
.stories{display:flex;gap:6px;flex-wrap:wrap}
.story{
  font-size:10.5px;letter-spacing:.02em;padding:4px 7px;border-radius:6px;font-variant-numeric:tabular-nums;
  border:1px solid transparent;
}
.story.keep{background:var(--jade-bg);color:var(--jade);border-color:rgba(75,122,90,.18)}
.story.cut{background:#F3F1EA;color:var(--ink4);text-decoration:line-through}
.epic-tag{font-size:10.5px;text-align:right;color:var(--ink3);letter-spacing:.04em}

.gates{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.gate{display:flex;align-items:center;gap:12px;padding:14px 16px}
.gate-ic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--jade-bg);color:var(--jade);flex:none}
.gate-k{font-size:11.5px;color:var(--ink3);margin:0}
.gate-v{font-size:14px;margin:1px 0 0;font-variant-numeric:tabular-nums}

.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cmp{padding:18px 20px}
.cmp h3{font-family:var(--serif);font-size:14px;margin:0 0 12px;display:flex;align-items:center;gap:7px;letter-spacing:.04em}
.cmp-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.cmp-list li{font-size:12.5px;color:var(--ink2);line-height:1.5;display:flex;gap:8px;align-items:flex-start}
.bullet{width:5px;height:5px;border-radius:50%;margin-top:8px;flex:none;background:var(--ink4)}
.cmp.cut .cmp h3{color:var(--cinnabar)}
.cmp.cut .bullet{background:var(--cinnabar);opacity:.55}
.cmp.keep .bullet{background:var(--jade);opacity:.6}

.chart-wrap{padding:20px 22px 12px}
.chart-legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.lg{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink2)}
.lg i{width:9px;height:9px;border-radius:3px;display:block}

/* ---------- docs ---------- */
.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.fbtn{
  min-height:34px;padding:0 13px;border-radius:99px;border:1px solid var(--line);background:#fff;
  font-size:12.5px;color:var(--ink2);display:flex;align-items:center;gap:6px;transition:all .15s;
}
.fbtn:hover{border-color:var(--ink4)}
.fbtn.on{background:var(--ink);color:#F7F5F0;border-color:var(--ink)}
.fbtn span{font-size:11px;opacity:.6;font-variant-numeric:tabular-nums}

.doc-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.doc{
  display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:13px;align-items:start;
  padding:15px 17px;border:1px solid var(--line);border-radius:12px;background:#fff;
  transition:border-color .16s,transform .16s,box-shadow .16s;
}
.doc:hover{border-color:#D5CEBE;transform:translateY(-1px);box-shadow:0 10px 24px -20px rgba(26,25,23,.5)}
.doc-ic{
  width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  background:var(--card2);color:var(--ink2);border:1px solid var(--line2);flex:none;
}
.doc-ic.k-db{background:var(--qing-bg);color:var(--qing);border-color:rgba(47,96,104,.14)}
.doc-ic.k-web{background:var(--amber-bg);color:var(--amber);border-color:rgba(168,129,63,.16)}
.doc-ic.k-file{background:var(--slate-bg);color:var(--slate);border-color:rgba(92,107,122,.14)}
.doc-t{font-size:13.5px;line-height:1.45;margin:0 0 5px;word-break:break-word}
.doc-m{font-size:11px;color:var(--ink3);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.doc-m .sep{width:1px;height:8px;background:var(--line)}
.doc-go{color:var(--ink4);padding-top:2px;transition:color .16s}
.doc:hover .doc-go{color:var(--ink)}
.doc.retired .doc-t{color:var(--ink3)}
.doc.retired .doc-ic{opacity:.5}

.local-row{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.local{padding:14px 16px;border:1px dashed #DCD5C6;border-radius:11px;background:rgba(255,255,255,.5)}
.local-k{font-size:11px;letter-spacing:.1em;color:var(--ink3);margin-bottom:6px}
.local-t{font-size:13px;margin:0 0 4px}
.local-p{font-size:11px;color:var(--ink2);margin:0;word-break:break-all;line-height:1.5;opacity:.85}

.tokens{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tok{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--ink2);border:1px solid var(--line2);border-radius:8px;padding:5px 9px;background:#fff}
.tok i{width:11px;height:11px;border-radius:3px;display:block;border:1px solid rgba(0,0,0,.06)}

/* ---------- study ---------- */
.study-top{display:grid;grid-template-columns:190px minmax(0,1fr);gap:16px;margin-bottom:18px}
.ring-card{padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.ring-num{font-family:var(--serif);font-size:25px;font-weight:600;font-variant-numeric:tabular-nums}
.ring-lb{font-size:11.5px;color:var(--ink3)}
.mod-list{display:flex;flex-direction:column;gap:9px}
.mod{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:13px;align-items:center;padding:13px 17px;border:1px solid var(--line);border-radius:11px;background:#fff;transition:background .15s}
.mod:hover{background:var(--card2)}
.mod-name{font-size:13px;margin:0 0 4px}
.mod-sub{font-size:11px;color:var(--ink3);margin:0}
.mod-bar{width:96px}
.mod-bar .bar{margin-top:0;height:5px}
.mod-bar span{display:block;font-size:10.5px;color:var(--ink3);text-align:right;margin-top:5px;font-variant-numeric:tabular-nums}
.mod-ic{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--card2);border:1px solid var(--line2);color:var(--ink2);font-family:var(--serif);font-size:12px}

.les-wrap{display:none;margin-top:12px}
.les-wrap.on{display:block}
.les-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:7px}
.les{
  display:flex;align-items:center;gap:8px;padding:9px 11px;border:1px solid var(--line2);border-radius:8px;
  background:#fff;font-size:12px;text-align:left;min-height:40px;transition:all .14s;
}
.les:hover{border-color:var(--ink4)}
.les.on{background:var(--jade-bg);border-color:rgba(75,122,90,.2);color:var(--jade)}
.les .bx{width:15px;height:15px;border-radius:4px;border:1.4px solid #D8D2C4;display:flex;align-items:center;justify-content:center;flex:none;color:transparent}
.les.on .bx{background:var(--jade);border-color:var(--jade);color:#fff}
.les-nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.les-tm{font-size:10px;color:var(--ink4);font-variant-numeric:tabular-nums;white-space:nowrap}
.les.on .les-tm{color:var(--jade);opacity:.75}

/* ---------- misc ---------- */
.empty{padding:26px;text-align:center;color:var(--ink3);font-size:12.5px}
.note{font-size:11.5px;color:var(--ink3);line-height:1.6;padding:12px 16px;border-left:2px solid var(--line);background:rgba(255,255,255,.5);border-radius:0 8px 8px 0}
.toast{
  position:fixed;left:50%;bottom:34px;transform:translate(-50%,14px);opacity:0;pointer-events:none;
  background:var(--ink);color:#F7F5F0;font-size:12.5px;padding:10px 18px;border-radius:99px;
  transition:all .24s ease;z-index:99;box-shadow:0 10px 30px -12px rgba(0,0,0,.5);
}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .snap{grid-template-columns:repeat(2,1fr)}
  .ms-row{grid-template-columns:repeat(2,1fr)}
  .local-row{grid-template-columns:repeat(2,1fr)}
  .doc-grid{grid-template-columns:1fr}
}

function ico(n,s){ s=s||16; return '<svg class="i" width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+(ICON[n]||'')+'</svg>'; }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function pct(a,b){ return b ? Math.round(a/b*100) : 0; }
function fmtMin(m){ const h=Math.floor(m/60), r=m%60; return r ? h+' 小时 '+r+' 分' : h+' 小时'; }
function pad(n){ return n<10 ? '0'+n : ''+n; }

const state = {
  view: 'today',
  q: '',
  filter: 'all',
  openMod: 'sl',
  tasks: {},     // id -> true
  lessons: {},   // lessonName -> true
  savedAt: 0
};

function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return;
    const o = JSON.parse(raw);
    if(o && typeof o === 'object'){
      if(o.tasks && typeof o.tasks === 'object') state.tasks = o.tasks;
      if(o.lessons && typeof o.lessons === 'object') state.lessons = o.lessons;
      if(o.view) state.view = o.view;
      if(o.openMod) state.openMod = o.openMod;
      state.savedAt = o.savedAt || 0;
    }
  }catch(e){ /* 首次打开或损坏，走默认值 */ }
}
function saveState(){
  state.savedAt = Date.now();
  try{ localStorage.setItem(STORE_KEY, JSON.stringify({
    tasks: state.tasks, lessons: state.lessons, view: state.view, openMod: state.openMod, savedAt: state.savedAt
  })); }
  catch(e){ /* 隐私模式下静默降级 */ }
  paintSaveState();
}
function paintSaveState(){
  const el = document.getElementById('saveText');
  if(!el) return;
  const d = state.savedAt ? new Date(state.savedAt) : null;
  el.textContent = d ? '本地已保存 · ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) : '本地存储就绪';
}

/* ============================================================
   数据派生（纯计算，不碰 DOM）
   ============================================================ */
function taskList(){
  return DATA.tasks.map(function(t){
    return Object.assign({}, t, { done: !!state.tasks[t.id] });
  });
}
function dueInfo(dueStr){
  const d = new Date(dueStr + 'T00:00:00');
  const diff = Math.round((d - D0) / 86400000);
  if(diff < 0)  return { txt:'逾期 ' + Math.abs(diff) + ' 天', red:true, past:true };
  if(diff === 0) return { txt:'今天', red:true, past:false };
  if(diff === 1) return { txt:'明天', red:false, past:false };
  if(diff <= 7)  return { txt:diff + ' 天后', red:false, past:false };
  return { txt: (d.getMonth()+1) + '月' + d.getDate() + '日', red:false, past:false };
}
function studyTotals(){
  let total = 0, done = 0, mins = 0, doneMins = 0;
  DATA.study.forEach(function(m){
    m.lessons.forEach(function(l){
      total++; mins += +l[1];
      if(state.lessons[l[0]]){ done++; doneMins += +l[1]; }
    });
  });
  return { total: total, done: done, mins: mins, doneMins: doneMins };
}
function curveTotal(){
  let t = 0;
  DATA.curve.forEach(function(g){ g.v.forEach(function(v){ t += v; }); });
  return t;
}

function curveChart(){
  const W = 660, H = 200, left = 10, bottom = 34, top = 12;
  const maxV = 92;
  const all = [];
  DATA.curve.forEach(function(g){ g.v.forEach(function(v){ all.push(v); }); });
  const bw = (W - left * 2) / all.length;
  let bars = '', labels = '', idx = 0, seps = '';
  DATA.curve.forEach(function(g){
    const startX = left + idx * bw;
    g.v.forEach(function(v){
      const h = Math.max(2, (v / maxV) * (H - bottom - top));
      const x = left + idx * bw + bw * 0.18;
      const y = H - bottom - h;
      bars += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + (bw * 0.64).toFixed(1) + '" height="' + h.toFixed(1) + '" rx="1.6" fill="' + g.color + '" opacity="' + (v / maxV > .5 ? .85 : .62) + '"/>';
      bars += '<text x="' + (x + bw*0.32).toFixed(1) + '" y="' + (y - 3).toFixed(1) + '" font-size="7.5" fill="#8D887E" text-anchor="middle">' + v + '</text>';
      idx++;
    });
    const cx = startX + (bw * g.v.length) / 2;
    labels += '<text x="' + cx.toFixed(1) + '" y="' + (H - 12) + '" font-size="10.5" fill="#56524A" text-anchor="middle" letter-spacing="1">' + g.tier + '</text>';
    seps += '<line x1="' + startX.toFixed(1) + '" y1="' + top + '" x2="' + startX.toFixed(1) + '" y2="' + (H - bottom + 4) + '" stroke="#E6E1D6" stroke-width="1" stroke-dasharray="2 4"/>';
  });
  const legend = DATA.curve.map(function(g){
    return '<span class="lg"><i style="background:' + g.color + '"></i>' + g.tier + ' 段</span>';
  }).join('') + '<span class="lg" style="color:#8D887E">单位：光 / 级</span>';
  return '<div class="chart-legend">' + legend + '</div>' +
    '<svg viewBox="0 0 ' + W + ' ' + H + '" style="display:block;width:100%;height:auto" role="img" aria-label="36 级灯焰需求曲线">' +
      seps + bars + labels +
      '<line x1="' + left + '" y1="' + (H - bottom) + '" x2="' + (W - left) + '" y2="' + (H - bottom) + '" stroke="#E6E1D6" stroke-width="1"/>' +
    '</svg>';
}

  '<div class="sec"><div class="sec-head"><h2>本地产物</h2><span class="hint">不随页面发布，仅本机</span></div>' +
    '<div class="local-row">' + locals + '</div></div>' +
  '<div class="sec"><div class="sec-head"><h2>设计令牌</h2><span class="hint">四域色 + 一天光影</span></div>' +
    '<div class="card" style="padding:16px 18px"><div class="tokens">' + toks + '</div>' +
    '<p style="font-size:11.5px;color:#8D887E;margin:12px 0 0;line-height:1.6">四域恒 S=100%，行动色不占色相（纯白 #f5f5f7）；时段色走「一天光影」——把饱和度压到 57% 以下，用明度递变区分时间轴语义，末端转向冷色。</p></div></div>';
}

function renderStudy(){
  const el = document.getElementById('view-study');
  const st = studyTotals();
  const q = state.q.trim().toLowerCase();
  const R = 48, C = 2 * Math.PI * R;
  const pctv = pct(st.done, st.total);

  const mods = DATA.study.map(function(m){
    const doneN = m.lessons.filter(function(l){ return state.lessons[l[0]]; }).length;
    const mins = m.lessons.reduce(function(a,l){ return a + (+l[1]); }, 0);
    const p = pct(doneN, m.lessons.length);
    return '<div class="card mod" data-mod="' + m.id + '">' +
      '<div class="mod-ic">' + m.ic + '</div>' +
      '<div><p class="mod-name">' + m.name + ' · ' + m.lessons.length + ' 节</p><p class="mod-sub">' + m.note + ' · ' + fmtMin(mins) + '</p></div>' +
      '<div class="mod-bar"><div class="bar"><i class="jade" style="width:' + p + '%"></i></div><span>' + doneN + ' / ' + m.lessons.length + '</span></div>' +
    '</div>';
  }).join('');

  const cur = DATA.study.filter(function(m){ return m.id === state.openMod; })[0] || DATA.study[0];
  const les = cur.lessons.filter(function(l){
    return !q || l[0].toLowerCase().indexOf(q) >= 0;
  });
  const lesHtml = les.length ? les.map(function(l){
    const on = !!state.lessons[l[0]];
    return '<button class="les' + (on ? ' on' : '') + '" type="button" data-les="' + l[0] + '">' +
      '<span class="bx">' + (on ? '<svg class="i" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7"/></svg>' : '') + '</span>' +
      '<span class="les-nm">' + l[0] + '</span>' +
      '<span class="les-tm">' + (l[2] ? l[2] : l[1] + '′') + '</span></button>';
  }).join('') : '<div class="empty">没有匹配的课时。</div>';

  el.innerHTML =
  '<div class="study-top">' +
    '<div class="card ring-card">' +
      '<svg width="116" height="116" viewBox="0 0 120 120" role="img" aria-label="课时完成度">' +
        '<circle cx="60" cy="60" r="' + R + '" fill="none" stroke="#EFEBE2" stroke-width="9"/>' +
        '<circle cx="60" cy="60" r="' + R + '" fill="none" stroke="#4B7A5A" stroke-width="9" stroke-linecap="round" ' +
          'stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + (C * (1 - pctv / 100)).toFixed(1) + '" transform="rotate(-90 60 60)"/>' +
        '<text x="60" y="58" text-anchor="middle" font-size="23" font-family="Songti SC,serif" fill="#1A1917">' + pctv + '%</text>' +
        '<text x="60" y="75" text-anchor="middle" font-size="9.5" fill="#8D887E">' + st.done + ' / ' + st.total + ' 节</text>' +
      '</svg>' +
      '<div style="text-align:center"><div class="ring-num">' + st.done + ' 节</div><div class="ring-lb">已刷 · 余 ' + fmtMin(st.mins - st.doneMins) + '</div></div>' +
    '</div>' +
    '<div class="card" style="padding:18px 20px;display:flex;flex-direction:column;justify-content:center;gap:10px">' +
      '<div style="display:flex;gap:26px;flex-wrap:wrap">' +
        '<div><div class="gate-k">总课时</div><div class="gate-v" style="font-family:var(--serif);font-size:21px">' + fmtMin(st.mins) + '</div></div>' +
        '<div><div class="gate-k">已投入</div><div class="gate-v" style="font-family:var(--serif);font-size:21px">' + fmtMin(st.doneMins) + '</div></div>' +
        '<div><div class="gate-k">剩余</div><div class="gate-v" style="font-family:var(--serif);font-size:21px">' + fmtMin(st.mins - st.doneMins) + '</div></div>' +
      '</div>' +
      '<p style="font-size:11.5px;color:#8D887E;margin:0;line-height:1.6">60 节 = 申论 20 + 判断 12 + 政治理论 6 + 言语 9 + 资料 8 + 数量 5。仅申论有排课时间与主讲（单淑玲，19:00 起），其余按单节时长估算。</p>' +
    '</div>' +
  '</div>' +
  '<div class="sec"><div class="sec-head"><h2>模块进度</h2><span class="hint">点一行展开课时</span></div>' +
    '<div class="mod-list">' + mods + '</div>' +
    '<div class="les-wrap on" style="margin-top:14px">' +
      '<div class="sec-head" style="margin-bottom:9px"><h2 style="font-size:14px">' + cur.name + ' · 课时清单</h2><span class="hint">' + cur.lessons.length + ' 节</span></div>' +
      '<div class="les-grid">' + lesHtml + '</div>' +
    '</div></div>';
}

/* ============================================================
   统一入口：只在这里按固定顺序调渲染函数（单向，无环）
   ============================================================ */
function refreshAll(){
  renderNav();
  renderHeader();
  renderToday();
  renderProgress();
  renderDocs();
  renderStudy();
  ['today','progress','docs','study'].forEach(function(v){
    document.getElementById('view-' + v).classList.toggle('gone', state.view !== v);
  });
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(t._tm);
  t._tm = setTimeout(function(){ t.classList.remove('on'); }, 1900);
}

/* ============================================================
   事件层：改数据 → 存 → refreshAll
   ============================================================ */
function bindEvents(){
  document.getElementById('nav').addEventListener('click', function(e){
    const b = e.target.closest('[data-view]');
    if(!b) return;
    state.view = b.getAttribute('data-view');
    state.q = '';
    document.getElementById('docSearch').value = '';
    saveState(); refreshAll();
    window.scrollTo({ top:0, behavior:'smooth' });
  });

  document.getElementById('view-today').addEventListener('click', function(e){
    const t = e.target.closest('[data-task]');
    if(t){
      const id = t.getAttribute('data-task');
      if(state.tasks[id]) delete state.tasks[id]; else state.tasks[id] = true;
      saveState(); refreshAll();
      return;
    }
    const g = e.target.closest('[data-goto]');
    if(g){ state.view = g.getAttribute('data-goto'); saveState(); refreshAll(); window.scrollTo({top:0,behavior:'smooth'}); }
  });

  document.getElementById('view-docs').addEventListener('click', function(e){
    const f = e.target.closest('[data-filter]');
    if(!f) return;
    state.filter = f.getAttribute('data-filter');
    saveState(); refreshAll();
  });

  document.getElementById('view-study').addEventListener('click', function(e){
    const m = e.target.closest('[data-mod]');
    if(m){
      const id = m.getAttribute('data-mod');
      state.openMod = id;
      saveState(); refreshAll();
      return;
    }
    const l = e.target.closest('[data-les]');
    if(l){
      const k = l.getAttribute('data-les');
      if(state.lessons[k]) delete state.lessons[k]; else state.lessons[k] = true;
      saveState(); refreshAll();
    }
  });

  document.getElementById('docSearch').addEventListener('input', function(e){
    state.q = e.target.value;
    renderDocs(); renderStudy();
  });

  document.getElementById('btnExport').addEventListener('click', function(){
    const blob = new Blob([JSON.stringify({
      app:'执灯人作战台', version:1, exportedAt:new Date().toISOString(),
      tasks:state.tasks, lessons:state.lessons
    }, null, 2)], { type:'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '执灯人作战台-备份-' + TODAY.getFullYear() + pad(TODAY.getMonth()+1) + pad(TODAY.getDate()) + '.json';
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1200);
    toast('已导出备份');
  });

  document.getElementById('btnImport').addEventListener('click', function(){
    document.getElementById('fileInput').click();
  });

  document.getElementById('fileInput').addEventListener('change', function(e){
    const f = e.target.files && e.target.files[0];
    if(!f) return;
    const r = new FileReader();
    r.onload = function(){
      try{
        const o = JSON.parse(r.result);
        if(o.tasks && typeof o.tasks === 'object') state.tasks = o.tasks;
        if(o.lessons && typeof o.lessons === 'object') state.lessons = o.lessons;
        saveState(); refreshAll(); toast('已导入并恢复');
      }catch(err){ toast('文件无法解析，未改动任何数据'); }
      e.target.value = '';
    };
    r.readAsText(f);
  });
}

/* ============================================================
   启动：读数据 → 绑事件 → 一次 refreshAll
   ============================================================ */
loadState();
bindEvents();
refreshAll();
paintSaveState();
</script>
</body>
</html>
