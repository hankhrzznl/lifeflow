/* LifeFlow 2.0 — 极简克制设计系统
   第一性原理：目标驱动的个人生活操作系统
   视觉原则：大留白 · 细线分层 · 单主色 · 克制圆角 · 精确排版
   表面模型：静态内容用边框/背景分层，浮动层才允许阴影
   色彩模型：石墨黑主色 + 中性灰阶 + 语义状态色（无模块彩）
*/

/* === LIGHT MODE（日间 · 极简克制） === */
:root {
  /* SURFACE & TEXT */
  --lifeflow-background: #F6F6F7;
  --lifeflow-foreground: #1A1A1E;
  --lifeflow-card: #FFFFFF;
  --lifeflow-card-foreground: #1A1A1E;
  --lifeflow-popover: #FFFFFF;
  --lifeflow-popover-foreground: #1A1A1E;
  --lifeflow-muted: #F0F0F2;
  --lifeflow-muted-foreground: #6E6E76;
  --lifeflow-border: rgba(26,26,30,0.10);
  --lifeflow-border-light: rgba(26,26,30,0.055);
  --lifeflow-border-dashed: rgba(26,26,30,0.16);
  --lifeflow-input: rgba(26,26,30,0.08);
  --lifeflow-ring: #1A1A1E;

  /* BRAND — 单主色（石墨黑，克制使用） */
  --lifeflow-primary: #1A1A1E;
  --lifeflow-primary-hover: #000000;
  --lifeflow-primary-light: rgba(26,26,30,0.06);
  --lifeflow-primary-foreground: #FFFFFF;

  /* PROGRESS */
  --lifeflow-knit-thread: #1A1A1E;
  --lifeflow-knit-thread-completed: #16A34A;
  --lifeflow-knit-thread-partial: #D97706;
  --lifeflow-knit-bg: #EDEDEF;
  --lifeflow-knit-grid: rgba(26,26,30,0.07);

  /* STATE — 语义状态色（仅用于状态，不用于身份标识） */
  --state-success: #16A34A;
  --state-success-light: rgba(22,163,74,0.08);
  --state-warning: #D97706;
  --state-warning-light: rgba(217,119,6,0.08);
  --state-error: #DC2626;
  --state-error-light: rgba(220,38,38,0.08);
  --state-info: #2563EB;
  --state-info-light: rgba(37,99,235,0.08);

  /* TEXT */
  --lifeflow-text-primary: #1A1A1E;
  --lifeflow-text-secondary: #55555E;
  --lifeflow-text-tertiary: #8A8A93;
  --lifeflow-text-disabled: #B8B8BF;
  --lifeflow-text-inverse: #FFFFFF;

  /* SHADOWS — 静态表面走边框，浮动层才用阴影（alpha <= 0.06） */
  --lifeflow-shadow-1: 0 1px 2px rgba(26,26,30,0.04);
  --lifeflow-shadow-2: 0 4px 16px rgba(26,26,30,0.06);
  --lifeflow-shadow-3: 0 12px 32px rgba(26,26,30,0.10);
  --lifeflow-shadow-knit: none;

  /* TAB BAR — 白底细顶线 */
  --lifeflow-tabbar-bg: rgba(255,255,255,0.92);
  --lifeflow-tabbar-blur: 16px;
  --lifeflow-tabbar-blur-saturate: 100%;

  /* AI BALL */
  --lifeflow-ai-ball: #1A1A1E;

  /* TYPOGRAPHY — 精确排版：收紧字距、克制字重 */
  --lifeflow-font-display: -apple-system, BlinkMacSystemFont, "SF Pro SC", "PingFang SC", "Noto Sans SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  --lifeflow-font-body: -apple-system, BlinkMacSystemFont, "SF Pro SC", "PingFang SC", "Noto Sans SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  --lifeflow-font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;

  --lifeflow-font-size-display: 32px;
  --lifeflow-font-size-h1: 26px;
  --lifeflow-font-size-h2: 20px;
  --lifeflow-font-size-h3: 16px;
  --lifeflow-font-size-body: 15px;
  --lifeflow-font-size-sm: 13px;
  --lifeflow-font-size-caption: 12px;

  /* SPACING */
  --lifeflow-space-xs: 4px;
  --lifeflow-space-sm: 8px;
  --lifeflow-space-md: 12px;
  --lifeflow-space-lg: 16px;
  --lifeflow-space-xl: 24px;
  --lifeflow-space-2xl: 32px;

  /* RADIUS — 克制圆角：sm 4 / md 8 / lg 12 / full */
  --lifeflow-radius-sm: 4px;
  --lifeflow-radius-md: 8px;
  --lifeflow-radius-lg: 12px;
  --lifeflow-radius-xl: 12px;
  --lifeflow-radius-full: 9999px;

  /* PORTABLE ALIASES */
  --background: var(--lifeflow-background);
  --foreground: var(--lifeflow-foreground);
  --card: var(--lifeflow-card);
  --card-foreground: var(--lifeflow-card-foreground);
  --popover: var(--lifeflow-popover);
  --popover-foreground: var(--lifeflow-popover-foreground);
  --primary: var(--lifeflow-primary);
  --primary-foreground: var(--lifeflow-primary-foreground);
  --muted: var(--lifeflow-muted);
  --muted-foreground: var(--lifeflow-muted-foreground);
  --border: var(--lifeflow-border);
  --input: var(--lifeflow-input);
  --ring: var(--lifeflow-ring);
  --radius-sm: var(--lifeflow-radius-sm);
  --radius-md: var(--lifeflow-radius-md);
  --radius-lg: var(--lifeflow-radius-lg);
  --color-background: var(--lifeflow-background);
  --color-foreground: var(--lifeflow-foreground);
  --color-card: var(--lifeflow-card);
  --color-card-foreground: var(--lifeflow-card-foreground);
  --color-popover: var(--lifeflow-popover);
  --color-popover-foreground: var(--lifeflow-popover-foreground);
  --color-primary: var(--lifeflow-primary);
  --color-primary-foreground: var(--lifeflow-primary-foreground);
  --color-muted: var(--lifeflow-muted);
  --color-muted-foreground: var(--lifeflow-muted-foreground);
  --color-border: var(--lifeflow-border);
  --color-input: var(--lifeflow-input);
  --color-ring: var(--lifeflow-ring);
  --color-text-primary: var(--lifeflow-text-primary);
  --color-text-secondary: var(--lifeflow-text-secondary);
  --color-text-tertiary: var(--lifeflow-text-tertiary);
  --color-text-disabled: var(--lifeflow-text-disabled);
  --color-surface-card: var(--lifeflow-card);
  --color-surface-muted: var(--lifeflow-muted);
}

/* === DARK MODE（夜间 · 深空石墨） === */
.dark {
  --lifeflow-background: #0E0E11;
  --lifeflow-foreground: #F2F2F4;
  --lifeflow-card: #16161A;
  --lifeflow-card-foreground: #F2F2F4;
  --lifeflow-popover: #1C1C21;
  --lifeflow-popover-foreground: #F2F2F4;
  --lifeflow-muted: #1E1E23;
  --lifeflow-muted-foreground: rgba(242,242,244,0.55);
  --lifeflow-border: rgba(255,255,255,0.10);
  --lifeflow-border-light: rgba(255,255,255,0.06);
  --lifeflow-border-dashed: rgba(255,255,255,0.18);
  --lifeflow-input: rgba(255,255,255,0.10);
  --lifeflow-ring: #F2F2F4;

  --lifeflow-primary: #F2F2F4;
  --lifeflow-primary-hover: #FFFFFF;
  --lifeflow-primary-light: rgba(255,255,255,0.09);
  --lifeflow-primary-foreground: #0E0E11;

  --lifeflow-knit-thread: #F2F2F4;
  --lifeflow-knit-thread-completed: #34D399;
  --lifeflow-knit-thread-partial: #FBBF24;
  --lifeflow-knit-bg: rgba(255,255,255,0.10);
  --lifeflow-knit-grid: rgba(255,255,255,0.07);

  --state-success: #34D399;
  --state-success-light: rgba(52,211,153,0.12);
  --state-warning: #FBBF24;
  --state-warning-light: rgba(251,191,36,0.12);
  --state-error: #F87171;
  --state-error-light: rgba(248,113,113,0.12);
  --state-info: #60A5FA;
  --state-info-light: rgba(96,165,250,0.12);

  --lifeflow-text-primary: #F2F2F4;
  --lifeflow-text-secondary: rgba(242,242,244,0.68);
  --lifeflow-text-tertiary: rgba(242,242,244,0.42);
  --lifeflow-text-disabled: rgba(242,242,244,0.28);
  --lifeflow-text-inverse: #0E0E11;

  --lifeflow-shadow-1: 0 1px 2px rgba(0,0,0,0.30);
  --lifeflow-shadow-2: 0 4px 16px rgba(0,0,0,0.40);
  --lifeflow-shadow-3: 0 12px 32px rgba(0,0,0,0.55);
  --lifeflow-shadow-knit: none;

  --lifeflow-tabbar-bg: rgba(14,14,17,0.88);
  --lifeflow-tabbar-blur: 16px;
  --lifeflow-tabbar-blur-saturate: 100%;

  --lifeflow-ai-ball: #F2F2F4;
}

/* === TYPOGRAPHY UTILITY CLASSES === */
.lf-display {
  font-family: var(--lifeflow-font-display);
  font-size: var(--lifeflow-font-size-display);
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.2;
}

.lf-h1 {
  font-family: var(--lifeflow-font-display);
  font-size: var(--lifeflow-font-size-h1);
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.25;
}

.lf-h2 {
  font-family: var(--lifeflow-font-display);
  font-size: var(--lifeflow-font-size-h2);
  font-weight: 600;
  letter-spacing: -0.015em;
  line-height: 1.3;
}

.lf-h3 {
  font-family: var(--lifeflow-font-body);
  font-size: var(--lifeflow-font-size-h3);
  font-weight: 600;
  letter-spacing: -0.01em;
  line-height: 1.4;
}

.lf-body {
  font-family: var(--lifeflow-font-body);
  font-size: var(--lifeflow-font-size-body);
  font-weight: 400;
  line-height: 1.55;
}

.lf-body-sm {
  font-family: var(--lifeflow-font-body);
  font-size: var(--lifeflow-font-size-sm);
  font-weight: 400;
  line-height: 1.5;
}

.lf-caption {
  font-family: var(--lifeflow-font-body);
  font-size: var(--lifeflow-font-size-caption);
  font-weight: 400;
  line-height: 1.5;
}

.lf-mono {
  font-family: var(--lifeflow-font-mono);
  font-size: var(--lifeflow-font-size-sm);
  font-weight: 400;
  line-height: 1.6;
}

/* === PROGRESS BAR（细胶囊） === */
.knit-track {
  position: relative;
  height: 5px;
  border-radius: var(--lifeflow-radius-full);
  overflow: hidden;
  background: var(--lifeflow-knit-bg);
}

.knit-fill {
  position: absolute;
  left: 0;
  top: 0;
  height: 100%;
  border-radius: var(--lifeflow-radius-full);
  background: var(--lifeflow-knit-thread);
  z-index: 2;
  transition: width 0.5s ease-in-out;
}

.knit-fill--done { background: var(--lifeflow-knit-thread-completed); }
.knit-fill--partial { background: var(--lifeflow-knit-thread-partial); }

.knit-yarn { display: none; }

.knit-percent {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  z-index: 4;
  font-family: var(--lifeflow-font-body);
  font-size: var(--lifeflow-font-size-sm);
  font-weight: 600;
  color: var(--lifeflow-text-primary);
  line-height: 1;
}

/* === TAB BAR（白底细顶线，跟随模式） === */
.lf-tabbar-glass {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 40;
  border-top: 1px solid var(--lifeflow-border);
  background: var(--lifeflow-tabbar-bg);
  -webkit-backdrop-filter: saturate(var(--lifeflow-tabbar-blur-saturate)) blur(var(--lifeflow-tabbar-blur));
  backdrop-filter: saturate(var(--lifeflow-tabbar-blur-saturate)) blur(var(--lifeflow-tabbar-blur));
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

/* === 极简通用组件 === */
/* 细线分隔列表（克制分割线） */
.lf-list-divider > * + * {
  border-top: 1px solid var(--lifeflow-border-light);
}

/* 卡片：静态内容用 1px 细边框 + 极淡阴影，不靠重阴影 */
.lf-surface {
  background: var(--lifeflow-card);
  border: 1px solid var(--lifeflow-border-light);
  border-radius: var(--lifeflow-radius-lg);
}

/* 数字对齐（时间/金额/进度） */
.lf-tabular {
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum";
}

/* 大数字（统计强调） */
.lf-stat {
  font-family: var(--lifeflow-font-display);
  font-size: 34px;
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
}

<!-- 主布局静态 CSS 兜底：无 Tailwind 运行时亦保证页面可渲染 -->
<style id="critical-layout">
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--lifeflow-background);
    color: var(--lifeflow-text-primary);
    font-family: var(--lifeflow-font-body);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  button, input { font-family: inherit; }
  .lf-page { max-width: 28rem; margin: 0 auto; padding: 12px 16px 100px; }
  .lf-header { position: relative; display: flex; align-items: center; justify-content: center; height: 44px; }
  .lf-back {
    position: absolute; left: -4px; top: 50%; transform: translateY(-50%);
    display: inline-flex; align-items: center; justify-content: center;
    width: 40px; height: 40px; color: var(--lifeflow-text-primary);
    background: transparent; border: 0; border-radius: var(--lifeflow-radius-full); cursor: pointer;
  }
  .lf-title { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; color: var(--lifeflow-text-primary); }
  .lf-section { margin-top: 32px; }
  .lf-label { display: block; margin-bottom: 10px; font-size: 13px; font-weight: 500; color: var(--lifeflow-text-secondary); }
  .lf-hint { margin: 8px 0 0; font-size: 12px; color: var(--lifeflow-text-tertiary); }
  .lf-tpl-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .lf-tpl {
    position: relative; display: flex; align-items: center; justify-content: center;
    min-height: 60px; padding: 10px 6px; font-size: 13px; line-height: 1.3; text-align: center;
    color: var(--lifeflow-text-secondary); background: var(--lifeflow-card);
    border: 1px solid var(--lifeflow-border-light); border-radius: var(--lifeflow-radius-lg);
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .lf-tpl.is-selected { color: var(--lifeflow-text-primary); font-weight: 600; border-color: var(--lifeflow-primary); background: var(--lifeflow-primary-light); }
  .lf-tpl-check { display: none; position: absolute; top: 6px; right: 6px; color: var(--lifeflow-primary); }
  .lf-tpl.is-selected .lf-tpl-check { display: block; }
  .lf-input {
    width: 100%; height: 48px; padding: 0 16px; font-size: 15px;
    color: var(--lifeflow-text-primary); background: var(--lifeflow-card);
    border: 1px solid var(--lifeflow-border-light); border-radius: var(--lifeflow-radius-md);
    outline: none; -webkit-appearance: none; appearance: none;
  }
  .lf-input::placeholder { color: var(--lifeflow-text-tertiary); }
  .lf-input:focus { border-color: var(--lifeflow-primary); }
  .lf-kr-card { background: var(--lifeflow-card); border: 1px solid var(--lifeflow-border-light); border-radius: var(--lifeflow-radius-lg); overflow: hidden; }
  .lf-kr-row { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 12px; }
  .lf-kr-row + .lf-kr-row { border-top: 1px solid var(--lifeflow-border-light); }
  .lf-kr-index { flex-shrink: 0; width: 34px; font-size: 13px; color: var(--lifeflow-text-tertiary); font-variant-numeric: tabular-nums; }
  .lf-kr-input { flex: 1; min-width: 0; height: 52px; padding: 0; font-size: 15px; color: var(--lifeflow-text-primary); background: transparent; border: 0; outline: none; }
  .lf-kr-input::placeholder { color: var(--lifeflow-text-tertiary); }
  .lf-kr-del {
    flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; color: var(--lifeflow-text-tertiary);
    background: transparent; border: 0; border-radius: var(--lifeflow-radius-sm); cursor: pointer;
  }
  .lf-kr-del:hover, .lf-kr-del:active { color: var(--state-error); }
  .lf-add-kr {
    display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; padding: 4px 0;
    font-size: 13px; font-weight: 500; color: var(--lifeflow-primary);
    background: transparent; border: 0; cursor: pointer;
  }
  .lf-due {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; min-height: 52px; padding: 0 16px; font-size: 15px;
    color: var(--lifeflow-text-primary); text-align: left; background: var(--lifeflow-card);
    border: 1px solid var(--lifeflow-border-light); border-radius: var(--lifeflow-radius-lg);
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .lf-due-value { display: inline-flex; align-items: center; gap: 4px; color: var(--lifeflow-text-primary); font-variant-numeric: tabular-nums; }
  .lf-btn-primary {
    display: flex; align-items: center; justify-content: center;
    width: 100%; height: 48px; margin-top: 40px; font-size: 15px; font-weight: 600;
    color: var(--lifeflow-text-inverse); background: var(--lifeflow-primary);
    border: 0; border-radius: var(--lifeflow-radius-md); cursor: pointer;
  }
  .lf-btn-primary:active { opacity: 0.85; }
  #bottom-nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    height: 60px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
    background: var(--lifeflow-tabbar-bg); border-top: 1px solid var(--lifeflow-border);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  #bottom-nav a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 0; color: var(--lifeflow-text-tertiary); text-decoration: none; }
  #bottom-nav a[data-active="true"] { color: var(--lifeflow-primary); }
  #bottom-nav span { font-size: 10.5px; line-height: 1; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
</style>

<div class="lf-page mx-auto max-w-md px-4 pt-3 pb-[100px]">

  <!-- 顶部：返回 + 标题 -->
  <header class="lf-header">
    <button type="button" data-dom-id="back-goals" aria-label="返回" class="lf-back">
      <i data-lucide="chevron-left" class="w-6 h-6"></i>
    </button>
    <h1 class="lf-title">新建目标</h1>
  </header>

  <!-- 模板选择 -->
  <section class="lf-section">
    <h2 class="lf-label">选择模板</h2>
    <div class="lf-tpl-grid" role="radiogroup" aria-label="选择模板">
      <button type="button" data-dom-id="tpl-1" role="radio" aria-checked="true" class="lf-tpl is-selected">
        <i data-lucide="check" class="lf-tpl-check w-3 h-3"></i>
        <span>备考冲刺</span>
      </button>
      <button type="button" data-dom-id="tpl-2" role="radio" aria-checked="false" class="lf-tpl">
        <i data-lucide="check" class="lf-tpl-check w-3 h-3"></i>
        <span>习惯养成</span>
      </button>
      <button type="button" data-dom-id="tpl-3" role="radio" aria-checked="false" class="lf-tpl">
        <i data-lucide="check" class="lf-tpl-check w-3 h-3"></i>
        <span>健康管理</span>
      </button>
      <button type="button" data-dom-id="tpl-4" role="radio" aria-checked="false" class="lf-tpl">
        <i data-lucide="check" class="lf-tpl-check w-3 h-3"></i>
        <span>自定义</span>
      </button>
    </div>
  </section>

  <!-- 目标名称 -->
  <section class="lf-section">
    <label class="lf-label" for="goal-name">目标名称</label>
    <input id="goal-name" data-dom-id="goal-name" type="text" class="lf-input" placeholder="如：通过 2027 省考" maxlength="30" autocomplete="off" enterkeyhint="next">
  </section>

  <!-- 关键结果（可选） -->
  <section class="lf-section">
    <label class="lf-label" for="kr-list">关键结果（可选）</label>
    <div class="lf-kr-card" id="kr-list" data-dom-id="kr-list">
      <div class="lf-kr-row" data-dom-id="kr-row-1">
        <span class="lf-kr-index">KR 1</span>
        <input type="text" class="lf-kr-input" placeholder="输入关键结果，如：完成真题 20 套" maxlength="60" autocomplete="off">
        <button type="button" data-dom-id="kr-remove-1" aria-label="删除该关键结果" class="lf-kr-del"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
      </div>
      <div class="lf-kr-row" data-dom-id="kr-row-2">
        <span class="lf-kr-index">KR 2</span>
        <input type="text" class="lf-kr-input" placeholder="输入关键结果" maxlength="60" autocomplete="off">
        <button type="button" data-dom-id="kr-remove-2" aria-label="删除该关键结果" class="lf-kr-del"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
      </div>
      <div class="lf-kr-row" data-dom-id="kr-row-3">
        <span class="lf-kr-index">KR 3</span>
        <input type="text" class="lf-kr-input" placeholder="输入关键结果" maxlength="60" autocomplete="off">
        <button type="button" data-dom-id="kr-remove-3" aria-label="删除该关键结果" class="lf-kr-del"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
      </div>
    </div>
    <button type="button" id="kr-add" data-dom-id="kr-add" class="lf-add-kr"><i data-lucide="plus" class="w-3.5 h-3.5"></i>添加关键结果</button>
    <p class="lf-hint">建议 2-3 条可衡量的结果，用于追踪目标进展</p>
  </section>

  <!-- 截止日期 -->
  <section class="lf-section">
    <span class="lf-label">截止日期</span>
    <button type="button" data-dom-id="goal-due" class="lf-due">
      <span>设定完成时间</span>
      <span class="lf-due-value" id="goal-due-value" data-dom-id="goal-due-value">2027-03-31<i data-lucide="chevron-right" class="w-4 h-4 text-[var(--lifeflow-text-tertiary)]"></i></span>
    </button>
    <input type="date" id="goal-due-picker" hidden>
  </section>

  <!-- 创建目标 -->
  <button type="button" data-dom-id="goal-submit" class="lf-btn-primary">创建目标</button>

</div>

<!-- 底部导航 4-tab（目标激活） -->
<nav data-mobile-nav="global" id="bottom-nav" class="lf-tabbar-glass w-full max-w-md mx-auto h-[60px]"><div class="grid grid-cols-4 h-full"><a href="#" data-dom-id="nav-home" data-nav-key="home" data-active="false" class="min-w-0 flex flex-col items-center justify-center gap-1 h-full text-[var(--lifeflow-text-tertiary)]"><i data-lucide="home" class="w-5 h-5 shrink-0"></i><span class="text-[10.5px] leading-none whitespace-nowrap max-w-full truncate">首页</span></a><a href="#" data-dom-id="nav-goals" data-nav-key="goals" data-active="true" class="min-w-0 flex flex-col items-center justify-center gap-1 h-full text-[var(--lifeflow-primary)]"><i data-lucide="target" class="w-5 h-5 shrink-0"></i><span class="text-[10.5px] leading-none whitespace-nowrap max-w-full truncate font-semibold">目标</span></a><a href="#" data-dom-id="nav-schedule" data-nav-key="schedule" data-active="false" class="min-w-0 flex flex-col items-center justify-center gap-1 h-full text-[var(--lifeflow-text-tertiary)]"><i data-lucide="calendar-days" class="w-5 h-5 shrink-0"></i><span class="text-[10.5px] leading-none whitespace-nowrap max-w-full truncate">日程</span></a><a href="#" data-dom-id="nav-ideal" data-nav-key="ideal" data-active="false" class="min-w-0 flex flex-col items-center justify-center gap-1 h-full text-[var(--lifeflow-text-tertiary)]"><i data-lucide="sun" class="w-5 h-5 shrink-0"></i><span class="text-[10.5px] leading-none whitespace-nowrap max-w-full truncate">理想日</span></a></div></nav>

<script>
(function () {
  'use strict';
  function qs(s, el) { return (el || document).querySelector(s); }
  function qsa(s, el) { return Array.prototype.slice.call((el || document).querySelectorAll(s)); }

  /* 模板单选 */
  var tplCards = qsa('.lf-tpl');
  tplCards.forEach(function (card) {
    card.addEventListener('click', function () {
      tplCards.forEach(function (c) { c.classList.remove('is-selected'); c.setAttribute('aria-checked', 'false'); });
      card.classList.add('is-selected');
      card.setAttribute('aria-checked', 'true');
    });
  });

  /* 关键结果：删除 + 添加 + 重新编号 */
  var krList = qs('#kr-list');
  function renumber() {
    qsa('.lf-kr-row', krList).forEach(function (row, i) {
      var index = row.querySelector('.lf-kr-index');
      var del = row.querySelector('.lf-kr-del');
      if (index) index.textContent = 'KR ' + (i + 1);
      if (del) del.setAttribute('data-dom-id', 'kr-remove-' + (i + 1));
    });
  }
  qsa('.lf-kr-del', krList).forEach(function (btn) {
    btn.addEventListener('click', function () {
      var row = btn.closest('.lf-kr-row');
      if (row) { row.remove(); renumber(); }
    });
  });
  var addBtn = qs('#kr-add');
  if (addBtn) {
    addBtn.addEventListener('click', function () {
      if (!krList) return;
      var row = document.createElement('div');
      row.className = 'lf-kr-row';
      row.innerHTML = '<span class="lf-kr-index">KR</span>' +
        '<input type="text" class="lf-kr-input" placeholder="输入关键结果" maxlength="60" autocomplete="off">' +
        '<button type="button" aria-label="删除该关键结果" class="lf-kr-del"><i data-lucide="trash-2" class="w-4 h-4"></i></button>';
      row.querySelector('.lf-kr-del').addEventListener('click', function () { row.remove(); renumber(); });
      krList.appendChild(row);
      renumber();
      if (window.lucide) { window.lucide.createIcons(); }
      var input = row.querySelector('.lf-kr-input');
      if (input) input.focus();
    });
  }
  renumber();

  /* 截止日期：点击唤起原生日期选择 */
  var dueBtn = qs('#goal-due');
  var dueValue = qs('#goal-due-value');
  var duePicker = qs('#goal-due-picker');
  if (dueBtn && duePicker && dueValue) {
    dueBtn.addEventListener('click', function () {
      try { duePicker.showPicker(); } catch (e) { duePicker.focus(); duePicker.click(); }
    });
    duePicker.addEventListener('change', function () {
      if (duePicker.value) dueValue.firstChild.textContent = duePicker.value;
    });
  }
})();
</script>
<script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
<script>lucide.createIcons();</script>
</body>
