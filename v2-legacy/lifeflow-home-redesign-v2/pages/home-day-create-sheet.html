    <style id="theme-vars">
/* LifeFlow 2.0 — 极简克制设计系统
   第一性原理：目标驱动的个人生活操作系统
   视觉原则：大留白 · 细线分层 · 单主色 · 克制圆角 · 精确排版
   表面模型：静态内容用边框/背景分层，浮动层才允许阴影
   色彩模型：石墨黑主色 + 中性灰阶 + 语义状态色（无模块彩）
*/

/* === LIGHT MODE（日间 · 极简克制） === */
:root {
  /* SURFACE & TEXT */
  --lifeflow-background: #F6F6F7;
  --lifeflow-foreground: #1A1A1E;
  --lifeflow-card: #FFFFFF;
  --lifeflow-card-foreground: #1A1A1E;
  --lifeflow-popover: #FFFFFF;
  --lifeflow-popover-foreground: #1A1A1E;
  --lifeflow-muted: #F0F0F2;
  --lifeflow-muted-foreground: #6E6E76;
  --lifeflow-border: rgba(26,26,30,0.10);
  --lifeflow-border-light: rgba(26,26,30,0.055);
  --lifeflow-border-dashed: rgba(26,26,30,0.16);
  --lifeflow-input: rgba(26,26,30,0.08);
  --lifeflow-ring: #1A1A1E;

  /* BRAND — 单主色（石墨黑，克制使用） */
  --lifeflow-primary: #1A1A1E;
  --lifeflow-primary-hover: #000000;
  --lifeflow-primary-light: rgba(26,26,30,0.06);
  --lifeflow-primary-foreground: #FFFFFF;

  /* PROGRESS */
  --lifeflow-knit-thread: #1A1A1E;
  --lifeflow-knit-thread-completed: #16A34A;
  --lifeflow-knit-thread-partial: #D97706;
  --lifeflow-knit-bg: #EDEDEF;
  --lifeflow-knit-grid: rgba(26,26,30,0.07);

  /* STATE — 语义状态色（仅用于状态，不用于身份标识） */
  --state-success: #16A34A;
  --state-success-light: rgba(22,163,74,0.08);
  --state-warning: #D97706;
  --state-warning-light: rgba(217,119,6,0.08);
  --state-error: #DC2626;
  --state-error-light: rgba(220,38,38,0.08);
  --state-info: #2563EB;
  --state-info-light: rgba(37,99,235,0.08);

  /* TEXT */
  --lifeflow-text-primary: #1A1A1E;
  --lifeflow-text-secondary: #55555E;
  --lifeflow-text-tertiary: #8A8A93;
  --lifeflow-text-disabled: #B8B8BF;
  --lifeflow-text-inverse: #FFFFFF;

  /* SHADOWS — 静态表面走边框，浮动层才用阴影（alpha <= 0.06） */
  --lifeflow-shadow-1: 0 1px 2px rgba(26,26,30,0.04);
  --lifeflow-shadow-2: 0 4px 16px rgba(26,26,30,0.06);
  --lifeflow-shadow-3: 0 12px 32px rgba(26,26,30,0.10);
  --lifeflow-shadow-knit: none;

  /* TAB BAR — 白底细顶线 */
  --lifeflow-tabbar-bg: rgba(255,255,255,0.92);
  --lifeflow-tabbar-blur: 16px;
  --lifeflow-tabbar-blur-saturate: 100%;

  /* AI BALL */
  --lifeflow-ai-ball: #1A1A1E;

  /* TYPOGRAPHY — 精确排版：收紧字距、克制字重 */
  --lifeflow-font-display: -apple-system, BlinkMacSystemFont, "SF Pro SC", "PingFang SC", "Noto Sans SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  --lifeflow-font-body: -apple-system, BlinkMacSystemFont, "SF Pro SC", "PingFang SC", "Noto Sans SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  --lifeflow-font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;

  --lifeflow-font-size-display: 32px;
  --lifeflow-font-size-h1: 26px;
  --lifeflow-font-size-h2: 20px;
  --lifeflow-font-size-h3: 16px;
  --lifeflow-font-size-body: 15px;
  --lifeflow-font-size-sm: 13px;
  --lifeflow-font-size-caption: 12px;

  /* SPACING */
  --lifeflow-space-xs: 4px;
  --lifeflow-space-sm: 8px;
  --lifeflow-space-md: 12px;
  --lifeflow-space-lg: 16px;
  --lifeflow-space-xl: 24px;
  --lifeflow-space-2xl: 32px;

  /* RADIUS — 克制圆角：sm 4 / md 8 / lg 12 / full */
  --lifeflow-radius-sm: 4px;
  --lifeflow-radius-md: 8px;
  --lifeflow-radius-lg: 12px;
  --lifeflow-radius-xl: 12px;
  --lifeflow-radius-full: 9999px;

  /* PORTABLE ALIASES */
  --background: var(--lifeflow-background);
  --foreground: var(--lifeflow-foreground);
  --card: var(--lifeflow-card);
  --card-foreground: var(--lifeflow-card-foreground);
  --popover: var(--lifeflow-popover);
  --popover-foreground: var(--lifeflow-popover-foreground);
  --primary: var(--lifeflow-primary);
  --primary-foreground: var(--lifeflow-primary-foreground);
  --muted: var(--lifeflow-muted);
  --muted-foreground: var(--lifeflow-muted-foreground);
  --border: var(--lifeflow-border);
  --input: var(--lifeflow-input);
  --ring: var(--lifeflow-ring);
  --radius-sm: var(--lifeflow-radius-sm);
  --radius-md: var(--lifeflow-radius-md);
  --radius-lg: var(--lifeflow-radius-lg);
  --color-background: var(--lifeflow-background);
  --color-foreground: var(--lifeflow-foreground);
  --color-card: var(--lifeflow-card);
  --color-card-foreground: var(--lifeflow-card-foreground);
  --color-popover: var(--lifeflow-popover);
  --color-popover-foreground: var(--lifeflow-popover-foreground);
  --color-primary: var(--lifeflow-primary);
  --color-primary-foreground: var(--lifeflow-primary-foreground);
  --color-muted: var(--lifeflow-muted);
  --color-muted-foreground: var(--lifeflow-muted-foreground);
  --color-border: var(--lifeflow-border);
  --color-input: var(--lifeflow-input);
  --color-ring: var(--lifeflow-ring);
  --color-text-primary: var(--lifeflow-text-primary);
  --color-text-secondary: var(--lifeflow-text-secondary);
  --color-text-tertiary: var(--lifeflow-text-tertiary);
  --color-text-disabled: var(--lifeflow-text-disabled);
  --color-surface-card: var(--lifeflow-card);
  --color-surface-muted: var(--lifeflow-muted);
}

/* === DARK MODE（夜间 · 深空石墨） === */
.dark {
  --lifeflow-background: #0E0E11;
  --lifeflow-foreground: #F2F2F4;
  --lifeflow-card: #16161A;
  --lifeflow-card-foreground: #F2F2F4;
  --lifeflow-popover: #1C1C21;
  --lifeflow-popover-foreground: #F2F2F4;
  --lifeflow-muted: #1E1E23;
  --lifeflow-muted-foreground: rgba(242,242,244,0.55);
  --lifeflow-border: rgba(255,255,255,0.10);
  --lifeflow-border-light: rgba(255,255,255,0.06);
  --lifeflow-border-dashed: rgba(255,255,255,0.18);
  --lifeflow-input: rgba(255,255,255,0.10);
  --lifeflow-ring: #F2F2F4;

  --lifeflow-primary: #F2F2F4;
  --lifeflow-primary-hover: #FFFFFF;
  --lifeflow-primary-light: rgba(255,255,255,0.09);
  --lifeflow-primary-foreground: #0E0E11;

  --lifeflow-knit-thread: #F2F2F4;
  --lifeflow-knit-thread-completed: #34D399;
  --lifeflow-knit-thread-partial: #FBBF24;
  --lifeflow-knit-bg: rgba(255,255,255,0.10);
  --lifeflow-knit-grid: rgba(255,255,255,0.07);

  --state-success: #34D399;
  --state-success-light: rgba(52,211,153,0.12);
  --state-warning: #FBBF24;
  --state-warning-light: rgba(251,191,36,0.12);
  --state-error: #F87171;
  --state-error-light: rgba(248,113,113,0.12);
  --state-info: #60A5FA;
  --state-info-light: rgba(96,165,250,0.12);

  --lifeflow-text-primary: #F2F2F4;
  --lifeflow-text-secondary: rgba(242,242,244,0.68);
  --lifeflow-text-tertiary: rgba(242,242,244,0.42);
  --lifeflow-text-disabled: rgba(242,242,244,0.28);
  --lifeflow-text-inverse: #0E0E11;

  --lifeflow-shadow-1: 0 1px 2px rgba(0,0,0,0.30);
  --lifeflow-shadow-2: 0 4px 16px rgba(0,0,0,0.40);
  --lifeflow-shadow-3: 0 12px 32px rgba(0,0,0,0.55);
  --lifeflow-shadow-knit: none;

  --lifeflow-tabbar-bg: rgba(14,14,17,0.88);
  --lifeflow-tabbar-blur: 16px;
  --lifeflow-tabbar-blur-saturate: 100%;

  --lifeflow-ai-ball: #F2F2F4;
}

/* === TYPOGRAPHY UTILITY CLASSES === */
.lf-display {
  font-family: var(--lifeflow-font-display);
  font-size: var(--lifeflow-font-size-display);
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.2;
}

.lf-h1 {
  font-family: var(--lifeflow-font-display);
  font-size: var(--lifeflow-font-size-h1);
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.25;
}

.lf-h2 {
  font-family: var(--lifeflow-font-display);
  font-size: var(--lifeflow-font-size-h2);
  font-weight: 600;
  letter-spacing: -0.015em;
  line-height: 1.3;
}

.lf-h3 {
  font-family: var(--lifeflow-font-body);
  font-size: var(--lifeflow-font-size-h3);
  font-weight: 600;
  letter-spacing: -0.01em;
  line-height: 1.4;
}

.lf-body {
  font-family: var(--lifeflow-font-body);
  font-size: var(--lifeflow-font-size-body);
  font-weight: 400;
  line-height: 1.55;
}

.lf-body-sm {
  font-family: var(--lifeflow-font-body);
  font-size: var(--lifeflow-font-size-sm);
  font-weight: 400;
  line-height: 1.5;
}

.lf-caption {
  font-family: var(--lifeflow-font-body);
  font-size: var(--lifeflow-font-size-caption);
  font-weight: 400;
  line-height: 1.5;
}

.lf-mono {
  font-family: var(--lifeflow-font-mono);
  font-size: var(--lifeflow-font-size-sm);
  font-weight: 400;
  line-height: 1.6;
}

/* === PROGRESS BAR（细胶囊） === */
.knit-track {
  position: relative;
  height: 5px;
  border-radius: var(--lifeflow-radius-full);
  overflow: hidden;
  background: var(--lifeflow-knit-bg);
}

.knit-fill {
  position: absolute;
  left: 0;
  top: 0;
  height: 100%;
  border-radius: var(--lifeflow-radius-full);
  background: var(--lifeflow-knit-thread);
  z-index: 2;
  transition: width 0.5s ease-in-out;
}

.knit-fill--done { background: var(--lifeflow-knit-thread-completed); }
.knit-fill--partial { background: var(--lifeflow-knit-thread-partial); }

.knit-yarn { display: none; }

.knit-percent {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  z-index: 4;
  font-family: var(--lifeflow-font-body);
  font-size: var(--lifeflow-font-size-sm);
  font-weight: 600;
  color: var(--lifeflow-text-primary);
  line-height: 1;
}

/* === TAB BAR（白底细顶线，跟随模式） === */
.lf-tabbar-glass {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 40;
  border-top: 1px solid var(--lifeflow-border);
  background: var(--lifeflow-tabbar-bg);
  -webkit-backdrop-filter: saturate(var(--lifeflow-tabbar-blur-saturate)) blur(var(--lifeflow-tabbar-blur));
  backdrop-filter: saturate(var(--lifeflow-tabbar-blur-saturate)) blur(var(--lifeflow-tabbar-blur));
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

/* === 极简通用组件 === */
/* 细线分隔列表（克制分割线） */
.lf-list-divider > * + * {
  border-top: 1px solid var(--lifeflow-border-light);
}

/* 卡片：静态内容用 1px 细边框 + 极淡阴影，不靠重阴影 */
.lf-surface {
  background: var(--lifeflow-card);
  border: 1px solid var(--lifeflow-border-light);
  border-radius: var(--lifeflow-radius-lg);
}

/* 数字对齐（时间/金额/进度） */
.lf-tabular {
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum";
}

/* 大数字（统计强调） */
.lf-stat {
  font-family: var(--lifeflow-font-display);
  font-size: 34px;
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
}

    <style id="critical-layout">
      /* ============================================================
         LifeFlow「新建事项」半屏表单 — 极简克制风 · 静态 CSS 兜底
         不依赖 Tailwind 运行时；所有布局与色彩均取自设计令牌
         ============================================================ */
      *, *::before, *::after { box-sizing: border-box; }

      html, body { min-height: 100%; }

      body {
        margin: 0;
        background: var(--lifeflow-background);
        color: var(--lifeflow-text-primary);
        font-family: var(--lifeflow-font-body);
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }

      /* 底部半屏表单面板（浮动层：细顶线 + 极淡投影 alpha<=0.05） */
      .create-sheet {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 40;
        max-width: 28rem;
        margin: 0 auto;
        border-top: 1px solid var(--lifeflow-border-light);
        border-radius: var(--lifeflow-radius-lg) var(--lifeflow-radius-lg) 0 0;
        background: var(--lifeflow-card);
        box-shadow: 0 -8px 32px color-mix(in srgb, var(--lifeflow-foreground) 5%, transparent);
        max-height: 92vh;
        overflow-y: auto;
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
        font-family: var(--lifeflow-font-body);
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }

      /* drag handle 细横条 */
      .sheet-handle {
        width: 36px;
        height: 4px;
        margin: 8px auto 0;
        border-radius: var(--lifeflow-radius-full);
        background: var(--lifeflow-border);
      }

      /* 标题行：居中标题 + 右上角关闭 */
      .sheet-head {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 44px;
        padding: 4px 12px 0;
      }
      .sheet-title {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.01em;
        line-height: 1.3;
        color: var(--lifeflow-text-primary);
      }
      .sheet-close {
        position: absolute;
        top: 50%;
        right: 8px;
        transform: translateY(-50%);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        padding: 0;
        border: none;
        border-radius: var(--lifeflow-radius-md);
        background: transparent;
        color: var(--lifeflow-text-secondary);
        cursor: pointer;
        transition: background-color 0.15s ease, color 0.15s ease;
      }
      .sheet-close:active { background: var(--lifeflow-primary-light); }

      /* 内容容器：mx-auto max-w-md px-4 pt-3 pb-[40px]（safe-area 由 inline 兜底） */
      .sheet-inner {
        max-width: 28rem;
        margin: 0 auto;
        padding: 12px 16px 40px;
      }

      /* 标题输入：1px 细边框 / 圆角 8 */
      .title-input {
        display: block;
        width: 100%;
        margin-top: 12px;
        padding: 12px 14px;
        border: 1px solid var(--lifeflow-border-light);
        border-radius: var(--lifeflow-radius-md);
        background: transparent;
        color: var(--lifeflow-text-primary);
        font-family: var(--lifeflow-font-body);
        font-size: var(--lifeflow-font-size-body);
        line-height: 1.5;
        -webkit-appearance: none;
        appearance: none;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }
      .title-input::placeholder { color: var(--lifeflow-text-tertiary); }
      .title-input:focus {
        outline: none;
        border-color: var(--lifeflow-ring);
        box-shadow: 0 0 0 3px var(--lifeflow-primary-light);
      }

      /* 分区小标题（次级 13） */
      .section-caption {
        margin: 20px 0 8px;
        font-size: var(--lifeflow-font-size-sm);
        font-weight: 500;
        letter-spacing: 0.01em;
        color: var(--lifeflow-text-secondary);
      }

      /* 时间卡片：白底 1px 细边框，行间细线分隔 */
      .field-card {
        border: 1px solid var(--lifeflow-border-light);
        border-radius: var(--lifeflow-radius-lg);
        background: var(--lifeflow-card);
        overflow: hidden;
      }
      .field-row {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 14px 16px;
        border: none;
        background: transparent;
        color: var(--lifeflow-text-primary);
        font-family: var(--lifeflow-font-body);
        text-align: left;
        cursor: pointer;
      }
      .field-row + .field-row { border-top: 1px solid var(--lifeflow-border-light); }
      .field-row:active { background: var(--lifeflow-muted); }
      .field-row-icon { width: 16px; height: 16px; color: var(--lifeflow-text-tertiary); flex-shrink: 0; }
      .field-row-label { font-size: var(--lifeflow-font-size-sm); color: var(--lifeflow-text-secondary); }
      .field-row-spacer { flex: 1; min-width: 8px; }
      .field-row-value {
        font-size: var(--lifeflow-font-size-body);
        color: var(--lifeflow-text-primary);
        font-variant-numeric: tabular-nums;
        font-feature-settings: "tnum";
      }
      .field-row-chevron { width: 16px; height: 16px; color: var(--lifeflow-text-tertiary); flex-shrink: 0; }

      /* 归属：细线分段器，激活项石墨黑底白字 */
      .seg {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 2px;
        padding: 2px;
        border: 1px solid var(--lifeflow-border-light);
        border-radius: var(--lifeflow-radius-md);
        background: var(--lifeflow-muted);
      }
      .seg-item {
        min-width: 0;
        height: 34px;
        padding: 0 2px;
        border: none;
        border-radius: 4px;
        background: transparent;
        color: var(--lifeflow-text-secondary);
        font-family: var(--lifeflow-font-body);
        font-size: var(--lifeflow-font-size-sm);
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        cursor: pointer;
        transition: background-color 0.15s ease, color 0.15s ease;
      }
      .seg-item.is-active {
        background: var(--lifeflow-primary);
        color: var(--lifeflow-primary-foreground);
      }

      /* 挂靠目标：折叠行 + 展开面板 */
      .goal-block { margin-top: 20px; }
      .goal-row {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 12px 14px;
        border: 1px solid var(--lifeflow-border-light);
        border-radius: var(--lifeflow-radius-md);
        background: var(--lifeflow-card);
        color: var(--lifeflow-text-primary);
        font-family: var(--lifeflow-font-body);
        text-align: left;
        cursor: pointer;
      }
      .goal-row:active { background: var(--lifeflow-muted); }
      .goal-row-main { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
      .goal-row-label { font-size: var(--lifeflow-font-size-sm); color: var(--lifeflow-text-secondary); }
      .goal-row-value { font-size: var(--lifeflow-font-size-body); color: var(--lifeflow-text-primary); }
      .goal-chevron { width: 16px; height: 16px; color: var(--lifeflow-text-tertiary); flex-shrink: 0; transition: transform 0.18s ease; }
      .goal-row.is-open .goal-chevron { transform: rotate(90deg); }
      .goal-panel {
        margin-top: 6px;
        border: 1px solid var(--lifeflow-border-light);
        border-radius: var(--lifeflow-radius-md);
        background: var(--lifeflow-card);
        overflow: hidden;
      }
      .goal-opt {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 11px 14px;
        border: none;
        background: transparent;
        color: var(--lifeflow-text-primary);
        font-family: var(--lifeflow-font-body);
        font-size: var(--lifeflow-font-size-body);
        text-align: left;
        cursor: pointer;
      }
      .goal-opt + .goal-opt { border-top: 1px solid var(--lifeflow-border-light); }
      .goal-opt-icon { width: 16px; height: 16px; color: var(--lifeflow-text-tertiary); flex-shrink: 0; }
      .goal-opt.is-selected { font-weight: 500; }
      .goal-opt.is-selected .goal-opt-icon { color: var(--lifeflow-primary); }

      /* 主按钮：石墨黑填充 / 圆角 8 / 白字 */
      .submit-btn {
        width: 100%;
        height: 48px;
        margin-top: 24px;
        border: none;
        border-radius: var(--lifeflow-radius-md);
        background: var(--lifeflow-primary);
        color: var(--lifeflow-primary-foreground);
        font-family: var(--lifeflow-font-body);
        font-size: var(--lifeflow-font-size-body);
        font-weight: 600;
        letter-spacing: 0.01em;
        cursor: pointer;
        transition: background-color 0.15s ease;
      }
      .submit-btn:active { background: var(--lifeflow-primary-hover); }

      /* 折叠面板显隐 */
      [hidden] { display: none !important; }

      /* 图标尺寸 */
      .icon-md { width: 18px; height: 18px; }
    </style>

    <main>
      <!-- 新建事项 · 底部半屏表单 -->
      <section class="create-sheet" data-dom-id="sheet-create" role="dialog" aria-modal="true" aria-label="新建事项">
        <div class="sheet-handle" aria-hidden="true"></div>

        <div class="sheet-head">
          <h1 class="sheet-title" id="title-create" data-dom-id="title-create">新建事项</h1>
          <button type="button" class="sheet-close" data-dom-id="sheet-close" aria-label="关闭" title="关闭"><i data-lucide="x" class="icon-md" aria-hidden="true"></i></button>
        </div>

        <div class="sheet-inner mx-auto max-w-md px-4 pt-3 pb-[40px]" style="padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px))">

          <input id="input-create" data-dom-id="input-create" type="text" class="title-input" placeholder="今天最重要的一件事…" aria-label="事项名称" autocomplete="off" enterkeyhint="done">

          <div class="section-caption">时间</div>
          <div class="field-card" data-dom-id="task-time-fields">
            <button type="button" class="field-row" data-dom-id="task-start-time" aria-label="开始时间：09:00">
              <i data-lucide="clock" class="field-row-icon" aria-hidden="true"></i>
              <span class="field-row-label">开始时间</span>
              <span class="field-row-spacer"></span>
              <span class="field-row-value">09:00</span>
              <i data-lucide="chevron-right" class="field-row-chevron" aria-hidden="true"></i>
            </button>
            <button type="button" class="field-row" data-dom-id="task-end-time" aria-label="结束时间：10:00">
              <i data-lucide="clock" class="field-row-icon" aria-hidden="true"></i>
              <span class="field-row-label">结束时间</span>
              <span class="field-row-spacer"></span>
              <span class="field-row-value">10:00</span>
              <i data-lucide="chevron-right" class="field-row-chevron" aria-hidden="true"></i>
            </button>
          </div>

          <div class="section-caption">归属</div>
          <div class="seg" role="radiogroup" aria-label="事项归属" data-dom-id="task-scope">
            <button type="button" role="radio" aria-checked="true" class="seg-item is-active" data-dom-id="task-scope-top3">今日三件事</button>
            <button type="button" role="radio" aria-checked="false" class="seg-item" data-dom-id="task-scope-goal">目标行动</button>
            <button type="button" role="radio" aria-checked="false" class="seg-item" data-dom-id="task-scope-habit">习惯打卡</button>
            <button type="button" role="radio" aria-checked="false" class="seg-item" data-dom-id="task-scope-schedule">日程</button>
          </div>

          <div class="goal-block">
            <button type="button" class="goal-row" data-dom-id="task-goal-attach" aria-expanded="false" aria-controls="goal-panel">
              <span class="goal-row-main">
                <span class="goal-row-label">挂靠目标</span>
                <span class="goal-row-value" id="goal-selected">省考 · 判断推理</span>
              </span>
              <i data-lucide="chevron-right" class="goal-chevron" aria-hidden="true"></i>
            </button>
            <div class="goal-panel" id="goal-panel" data-dom-id="task-goal-panel" hidden>
              <button type="button" class="goal-opt is-selected" data-goal="省考 · 判断推理"><i data-lucide="target" class="goal-opt-icon" aria-hidden="true"></i>省考 · 判断推理</button>
              <button type="button" class="goal-opt" data-goal="省考 · 言语理解"><i data-lucide="target" class="goal-opt-icon" aria-hidden="true"></i>省考 · 言语理解</button>
              <button type="button" class="goal-opt" data-goal="申论 · 大作文框架"><i data-lucide="target" class="goal-opt-icon" aria-hidden="true"></i>申论 · 大作文框架</button>
              <button type="button" class="goal-opt" data-goal="不挂靠"><i data-lucide="target" class="goal-opt-icon" aria-hidden="true"></i>不挂靠</button>
            </div>
          </div>

          <button type="button" class="submit-btn" data-dom-id="submit-create">添加事项</button>

        </div>
      </section>
    </main>

    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <script>lucide.createIcons();</script>
    <script>
    (function () {
      /* 归属分段器：细线分段单选（静态示意） */
      document.querySelectorAll('.seg-item').forEach(function (btn) {
        btn.addEventListener('click', function () {
          document.querySelectorAll('.seg-item').forEach(function (x) {
            x.classList.remove('is-active');
            x.setAttribute('aria-checked', 'false');
          });
          btn.classList.add('is-active');
          btn.setAttribute('aria-checked', 'true');
        });
      });

      /* 挂靠目标：折叠展开 + 选项选择 */
      var goalRow = document.querySelector('[data-dom-id="task-goal-attach"]');
      var goalPanel = document.getElementById('goal-panel');
      if (goalRow && goalPanel) {
        goalRow.addEventListener('click', function () {
          var willOpen = goalPanel.hidden;
          goalPanel.hidden = !willOpen;
          goalRow.classList.toggle('is-open', willOpen);
          goalRow.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
        });
      }
      document.querySelectorAll('.goal-opt').forEach(function (opt) {
        opt.addEventListener('click', function () {
          document.querySelectorAll('.goal-opt').forEach(function (x) { x.classList.remove('is-selected'); });
          opt.classList.add('is-selected');
          var label = opt.getAttribute('data-goal') || opt.textContent.trim();
          var target = document.getElementById('goal-selected');
          if (target) target.textContent = label;
          if (goalPanel) goalPanel.hidden = true;
          if (goalRow) {
            goalRow.classList.remove('is-open');
            goalRow.setAttribute('aria-expanded', 'false');
          }
        });
      });
    })();
    </script>
</body>
</html>
